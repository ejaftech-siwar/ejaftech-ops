<style>
:root{--navy:#1B3A6B;--navy-2:#2E5FA3;--gold:#C9A84C;--gold-2:#B58E2E;--bg:#F5F8FC;--card:#FFFFFF;--line:#D6E4F0;--text:#1A1A2E;--muted:#6B7B8F;--green:#2E7D32;--green-bg:#E8F2E8;--orange:#E65100;--orange-bg:#FCEAE0;--purple:#6A1B9A;--purple-bg:#F0E8F7;--yellow:#FFF2CC;--yellow-text:#7F6000;--red:#C0392B;--shadow:0 2px 12px rgba(27,58,107,0.08);--shadow-lg:0 8px 28px rgba(27,58,107,0.15);--radius:14px;--radius-sm:8px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:contain;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
body{padding-bottom:env(safe-area-inset-bottom,0px)}

/* Login screen */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#1B3A6B 0%,#2E5FA3 100%);color:white}
.login-card{background:white;color:var(--text);border-radius:18px;padding:32px 24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-logo{width:96px;height:96px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;overflow:hidden}
.login-card h2{font-family:'DM Serif Display',serif;font-size:24px;color:var(--navy);text-align:center;margin:0 0 6px}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.login-card label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;margin-top:14px}
.login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;outline:none}
.login-card input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(46,95,163,0.12)}
.login-btn{width:100%;margin-top:20px;padding:14px;background:var(--navy);color:var(--gold);border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.login-btn:disabled{opacity:0.6}
.login-err{background:#FEE;color:var(--red);padding:10px 14px;border-radius:8px;font-size:12px;margin-top:14px;border:1px solid #FCC}
.setup-needed{background:linear-gradient(135deg,#1B3A6B,#2E5FA3);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;flex-direction:column}
.setup-needed h2{font-family:'DM Serif Display',serif;color:var(--gold);font-size:26px;margin:16px 0 8px}
.setup-needed p{color:#B8CFE8;max-width:400px;line-height:1.6}
.setup-needed code{background:rgba(0,0,0,0.3);color:var(--gold);padding:2px 6px;border-radius:4px;font-size:12px}

/* Main app */
.app-header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#1B3A6B 0%,#2E5FA3 100%);color:white;padding:env(safe-area-inset-top,0px) 0 0 0;box-shadow:var(--shadow-lg)}
.header-row{display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo-mark{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.app-title{flex:1;min-width:0}
.app-title h1{margin:0;font-size:15px;font-weight:700;color:white;line-height:1.1}
.app-title p{margin:2px 0 0;font-size:11px;color:#B8CFE8}
.user-chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:14px;font-size:11px;font-weight:600;background:rgba(255,255,255,0.12);color:white;cursor:pointer}
.user-chip .role-badge{background:var(--gold);color:var(--navy);padding:1px 6px;border-radius:8px;font-size:9px;font-weight:800;text-transform:uppercase}
.tab-bar{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.15);position:relative}
.tab-bar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:12px 14px;font-size:12px;font-weight:600;color:#94B0CC;background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit;transition:color 0.25s ease,background 0.25s ease,border-color 0.25s ease}
.tab.active{color:var(--gold);background:rgba(201,168,76,0.08);border-bottom-color:var(--gold)}
.tab-indicator{position:absolute;bottom:0;height:3px;background:var(--gold);border-radius:2px 2px 0 0;transition:left 0.35s cubic-bezier(0.4,0,0.2,1),width 0.35s cubic-bezier(0.4,0,0.2,1);pointer-events:none;box-shadow:0 0 8px rgba(201,168,76,0.5);left:0;width:0}

.content{padding:14px 12px 80px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:var(--navy);margin:0 0 12px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px}
.sec-hdr{background:linear-gradient(90deg,var(--navy-2),var(--navy));color:white;margin:-16px -16px 14px;padding:10px 16px;border-radius:var(--radius) var(--radius) 0 0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px;border-left:4px solid var(--accent,var(--navy));box-shadow:var(--shadow)}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:4px}
.kpi-value{font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent,var(--navy));line-height:1;margin-bottom:2px}
.kpi-sub{font-size:10px;color:var(--muted)}

.form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form-grid.full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--card);color:var(--text);width:100%;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(46,95,163,0.12)}
.field .auto{padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13px;font-weight:700;display:flex;align-items:center;min-height:42px}
.auto.green{background:var(--green-bg);color:var(--green)}
.auto.orange{background:var(--orange-bg);color:var(--orange)}
.auto.purple{background:var(--purple-bg);color:var(--purple)}
.auto.yellow{background:var(--yellow);color:var(--yellow-text)}
.auto.empty{color:var(--muted);font-weight:400}

.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;border:none;cursor:pointer;font-family:inherit;transition:transform 0.1s}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--navy);color:var(--gold)}
.btn-secondary{background:var(--navy-2);color:white}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn-danger{background:var(--red);color:white}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.tbl-wrap{margin:0 -16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:100%}
.tbl th{background:var(--navy);color:white;padding:9px 10px;text-align:left;font-weight:700;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:nth-child(even) td{background:#F8FAFD}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px}
.badge-ent{background:var(--green-bg);color:var(--green)}
.badge-sec{background:var(--orange-bg);color:var(--orange)}
.badge-eja{background:var(--purple-bg);color:var(--purple)}
.badge-admin{background:#FFE0E0;color:var(--red)}
.badge-hr{background:#E0F0FF;color:var(--navy-2)}
.badge-emp{background:#F0F0F0;color:var(--muted)}

.empty{padding:24px 16px;text-align:center;color:var(--muted);font-style:italic;font-size:13px}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-row select{padding:7px 10px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:12px;font-family:inherit}
.count-pill{background:var(--navy);color:white;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}

.dept-block{margin-bottom:16px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.dept-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;color:white}
.dept-head.ent{background:linear-gradient(135deg,#2E7D32,#1B5E20)}
.dept-head.sec{background:linear-gradient(135deg,#E65100,#BF360C)}
.dept-head.eja{background:linear-gradient(135deg,#6A1B9A,#4A148C)}
.dept-head h3{margin:0;font-size:13px;font-weight:800;text-transform:uppercase}
.dept-head .total{font-family:'DM Serif Display',serif;font-size:22px}
.dept-body{padding:12px 14px;background:white}
.dept-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.dept-row:last-child{border-bottom:none}
.dept-row .name{font-weight:600;color:var(--navy)}
.dept-row .hrs{font-weight:700;font-variant-numeric:tabular-nums}
.dept-row .pct{font-size:11px;color:var(--muted);font-weight:600;min-width:44px;text-align:right}
.dept-row .bar-container{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.dept-row .bar-fill{height:100%;transition:width 0.4s}
.dept-row.ent .bar-fill{background:var(--green)}
.dept-row.sec .bar-fill{background:var(--orange)}
.dept-row.eja .bar-fill{background:var(--purple)}

.donut-container{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0}
.donut-svg{width:200px;height:200px}
.donut-legend{width:100%;display:grid;gap:6px}
.donut-leg-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#F8FAFD;border-radius:var(--radius-sm);font-size:12px}
.donut-leg-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.donut-leg-name{flex:1;font-weight:600;color:var(--navy)}
.donut-leg-val{font-weight:700;font-variant-numeric:tabular-nums}
.donut-leg-pct{font-size:11px;color:var(--muted);font-weight:600;min-width:40px;text-align:right}

.proj-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.proj-chip{background:#F8FAFD;border:1px solid var(--line);padding:4px 10px;border-radius:14px;font-size:11px;color:var(--navy);display:flex;align-items:center;gap:6px}

.user-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:white}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-info .name{font-weight:700;color:var(--navy);font-size:13px}
.user-info .email{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}

.loader{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F8FC}
.loader-spin{width:48px;height:48px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE DESIGN — Tablet & Desktop
   Mobile stays as-is (≤768px). Larger screens use more space.
   ═══════════════════════════════════════════════════════════ */

/* Tablet (768px+) — wider content, centered tabs */
@media(min-width:768px){
  .content{max-width:1000px;padding:20px 24px 80px}
  .header-row{padding:14px 28px}
  .app-title h1{font-size:17px}
  .app-title p{font-size:12px}
  .tab-bar{padding:0 16px;justify-content:center;flex-wrap:wrap;overflow-x:visible}
  .tab{padding:14px 18px;font-size:13px}
  .card{padding:20px}
  .form-grid{grid-template-columns:repeat(3,1fr)}
  .kpi-grid{grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi-value{font-size:26px}
}

/* Desktop (1024px+) — full use of screen, larger tables */
@media(min-width:1024px){
  .content{max-width:1240px;padding:24px 32px 80px}
  .header-row{padding:16px 40px}
  .logo-mark{width:48px;height:48px;font-size:18px}
  .app-title h1{font-size:19px}
  .tab-bar{padding:0 24px}
  .tab{padding:14px 22px;font-size:14px}
  .card{padding:24px}
  .card-title{font-size:14px}
  .kpi-value{font-size:30px}
  /* Tables breathe more on desktop */
  .tbl th,.tbl td{padding:11px 14px;font-size:13px}
  /* Forms can use 3-4 columns on wide screens */
  .form-grid{grid-template-columns:repeat(3,1fr);gap:14px}
  /* Dashboard / report cards can sit side-by-side via grid where used */
  .desktop-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
}

/* Large desktop (1440px+) — comfortable max width, no over-stretching */
@media(min-width:1440px){
  .content{max-width:1360px}
  .form-grid{grid-template-columns:repeat(4,1fr)}
}

/* Make all tables horizontally scrollable on any screen if too wide */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Hover effects only on devices that support hover (desktop) */
@media(hover:hover){
  .tab:hover{color:var(--gold);background:rgba(201,168,76,0.05)}
  .card:hover{box-shadow:var(--shadow-lg)}
  .btn:hover{filter:brightness(1.05)}
  .kpi:hover{transform:translateY(-2px);transition:transform 0.2s}
}

//  IMAGE COMPRESSION HELPER
//  Compresses an image File to a base64 string for Firestore storage.
//  Settings: max 1024px width, 60% JPEG quality → typically ~50-150 KB
// ═══════════════════════════════════════════════════════════════════════
function compressImage(file, maxWidth = 1024, quality = 0.6){
  return new Promise((resolve, reject) => {
    if(!file || !file.type.startsWith('image/')){
      return reject(new Error('Not an image'));
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Read failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Image load failed'));
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if(w > maxWidth){
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        // White background (handles transparent PNGs)
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const base64 = canvas.toDataURL('image/jpeg', quality);
        resolve(base64);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Approximate KB size of a base64 string
function base64SizeKB(b64){
  if(!b64) return 0;
  const len = b64.length - (b64.indexOf(',') + 1);
  return Math.round(len * 3 / 4 / 1024);
}

function emailGetSettings(){

    allowedRoles: ["admin"], triggers: ["daily","clientRequests"],

    includeClients: false,     // also send to all client users
  };
}

// Resolve the full recipient list: manual contacts + (optionally) all employees + all clients.
// Returns array of {name, email}, de-duplicated by email.
function resolveEmailRecipients(){
  const s = emailGetSettings();
  const out = [];
  const seen = new Set();
  const add = (name, email) => {
    if(!email || !email.includes("@")) return;
    const key = email.toLowerCase().trim();
    if(seen.has(key)) return;
    seen.add(key);
    out.push({name: name||email, email: email.trim()});
  };
  // 1. Manual recipients
  (state.emailContacts||[]).forEach(c => add(c.name, c.email));
  // 2. All employee-role users (if enabled)
  if(s.includeEmployees){
    (state.users||[]).forEach(u => {
      const role = (u.role||"").toLowerCase();
      if(role==="employee" || role==="hr" || role==="support" || role==="it") add(u.name, u.email);
    });
  }
  // 3. All client users (if enabled)
  if(s.includeClients){
    (state.users||[]).forEach(u => {
      if((u.role||"").toLowerCase()==="client") add(u.name, u.email);
    });
  }
  return out;
}

// Get list of employees (from users + defaults)
// Only includes users explicitly marked as tracked employees (isTrackedEmployee=true)
// or users whose role is "employee" (default behavior for backward compatibility)
function allEmployees(){
  const fromUsers = state.users
    .filter(u => {
      if(!u.employeeName) return false;
      // Explicit flag takes priority
      if(u.isTrackedEmployee === true) return true;
      if(u.isTrackedEmployee === false) return false;
      // Backward compatibility: include only "employee" role by default
      // HR and admin are EXCLUDED unless explicitly marked
      // Case-insensitive role comparison for safety
      const role = (u.role || "").toString().toLowerCase().trim();
      return role === "employee";
    })
    .map(u => (u.employeeName || "").trim())
    .filter(Boolean);
  const fromNametags = (state.nametagEmployees || []).map(n => (n.name || "").trim()).filter(Boolean);
  const merged = Array.from(new Set([...EMPLOYEES_DEFAULT, ...fromUsers, ...fromNametags]));
  return merged;
}

// Applies ALL active filters at once: date period + employee + project + location.
// Used across every report view so filters are consistent everywhere.
// dateField defaults to "date" (use "from" for leaves).
// Project/location filters are skipped for records that don't carry those fields
// (e.g. leaves have no project/location), so they don't vanish unexpectedly.
function applyReportFilters(rows, dateField="date"){
  let out = filterByPeriod(rows, dateField);          // 1. date range
  const sel = state.globalEmployeeFilter || [];
  if(sel.length > 0) out = out.filter(r => sel.includes(r.employee)); // 2. employee
  const pf = state.globalProjectFilter || "";
  if(pf) out = out.filter(r => !("project" in r) || r.project === pf); // 3. project (skip if field absent)
  const lf = state.globalLocationFilter || "";
  if(lf) out = out.filter(r => !("location" in r) || r.location === lf); // 4. location (skip if field absent)
  return out;
}

function toggleEmployeeFilter(name, fromModal){
  const sel = state.globalEmployeeFilter || [];
  const idx = sel.indexOf(name);
  if(idx >= 0) sel.splice(idx, 1);
  else sel.push(name);
  state.globalEmployeeFilter = sel;
  if(fromModal){
    // Update count in modal without closing it
    const cnt = document.getElementById('empFilterCount');
    if(cnt) cnt.textContent = sel.length === 0 ? 'All employees (no filter)' : sel.length + ' employee(s) selected';
  } else {
    render();
  }
}

  state.globalEmployeeFilter = [];  // empty = all

  const ua = navigator.userAgent || "";
  let device = "Device";
  if(/iPhone|iPad|iPod/i.test(ua)) device = "iPhone/iPad";
  else if(/Android/i.test(ua)) device = "Android";
  else if(/Windows/i.test(ua)) device = "Windows PC";
  else if(/Macintosh/i.test(ua)) device = "Mac";
  else if(/Linux/i.test(ua)) device = "Linux";
  let browser = "";
  if(/Edg/i.test(ua)) browser = "Edge";
  else if(/Chrome/i.test(ua)) browser = "Chrome";
  else if(/Firefox/i.test(ua)) browser = "Firefox";
  else if(/Safari/i.test(ua)) browser = "Safari";
  return browser ? device + " · " + browser : device;
}

// Try to claim the session for this device. Returns {ok:true} or {ok:false, reason, heldBy}.
async function claimSession(profile){
  const {db, doc, getDoc, setDoc} = window.__fb;
  const deviceId = getDeviceId();
  // Admins and multi-device users bypass the lock entirely
  const role = (profile.role||"").toLowerCase();
  const isAdminRole = role === "admin" || role === "owner";
  const multiAllowed = profile.allowMultiDevice === true;
  if(isAdminRole || multiAllowed){
    // Still record this device (informational), but never block
    try{
      await setDoc(doc(db,"users",profile.uid),{
        activeSession: deviceId,
        activeSessionLabel: getDeviceLabel(),
        activeSessionAt: new Date().toISOString(),
      },{merge:true});
    }catch(e){}
    return {ok:true};
  }
  // Single-device users: check current holder
  try{
    const snap = await getDoc(doc(db,"users",profile.uid));
    const data = snap.exists() ? snap.data() : {};
    const current = data.activeSession || "";
    if(current && current !== deviceId){
      // Another device holds the session → block this one
      return {ok:false, reason:"elsewhere", heldBy: data.activeSessionLabel || "another device", since: data.activeSessionAt};
    }
    // Claim it
    await setDoc(doc(db,"users",profile.uid),{
      activeSession: deviceId,
      activeSessionLabel: getDeviceLabel(),
      activeSessionAt: new Date().toISOString(),
    },{merge:true});
    return {ok:true};
  }catch(e){
    console.error("claimSession error:", e);
    return {ok:true}; // fail-open: don't lock people out on errors
  }
}

// Release this device's claim on sign-out (only if we currently hold it)
async function releaseSession(){
  try{
    const {db, doc, getDoc, updateDoc} = window.__fb;
    if(!state.profile) return;
    const deviceId = getDeviceId();
    const snap = await getDoc(doc(db,"users",state.profile.uid));
    if(snap.exists() && snap.data().activeSession === deviceId){
      await updateDoc(doc(db,"users",state.profile.uid),{ activeSession: "" });
    }
  }catch(e){}
}

// Watch the user doc; if another device takes over the session, force logout here.
// (Used when admin resets a session, or for the rare race condition.)
function watchSessionLock(){
  try{
    const {db, doc, onSnapshot} = window.__fb;
    if(!state.profile) return;
    const role = (state.profile.role||"").toLowerCase();
    if(role==="admin"||role==="owner"||state.profile.allowMultiDevice===true) return; // exempt
    const deviceId = getDeviceId();
    if(state._sessionUnsub){ try{state._sessionUnsub();}catch(e){} }
    state._sessionUnsub = onSnapshot(doc(db,"users",state.profile.uid),(snap)=>{
      if(!snap.exists()) return;
      const active = snap.data().activeSession || "";
      if(active && active !== deviceId){
        // Someone else claimed the session → log this device out
        if(state._sessionUnsub){ try{state._sessionUnsub();}catch(e){} state._sessionUnsub=null; }
        forceLogoutElsewhere(snap.data().activeSessionLabel || "another device");
      }
    });
  }catch(e){}
}

async function loadProfile(){
  try{
    const{db,doc,getDoc}=window.__fb;
    const snap=await getDoc(doc(db,"users",state.user.uid));
    if(snap.exists()){
      state.profile={uid:state.user.uid,...snap.data()};
    } else {
      state.profile=null;
    }
  } catch(e){
    console.error("Load profile error:",e);
    state.profile=null;
  }
}

function cleanupSubs(){
  state.unsubs.forEach(u=>{try{u();}catch(e){}});
  state.unsubs=[];
}

async function subscribeData(){
  cleanupSubs();
  const{db,collection,onSnapshot,doc}=window.__fb;
  state.initialized=false;
  renderRoot(`<div class="loader"><div class="loader-spin"></div></div>`);

  const subs=[
    ["daily","daily"],["overtime","overtime"],["travel","travel"],["leaves","leaves"],
    ["projects","projects"],["locations","locations"],["users","users"],
    ["departments","departments"],
    ["workCategories","workCategories"],["workTasks","workTasks"],
    ["nametagEmployees","nametagEmployees"],
    ["employeePermissions","employeePermissions"],
    ["clients","clients"],
    ["clientRequests","clientRequests"],
    ["waContacts","waContacts"],
    ["emailContacts","emailContacts"],
  ];
  let firstCount=0;

  subs.forEach(([col,key])=>{
    const unsub=onSnapshot(collection(db,col),async(snap)=>{
      const items=[];
      snap.forEach(d=>items.push({id:d.id,...d.data()}));
      if(["daily","overtime","travel"].includes(col)){
        items.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      } else if(col==="users"){
        items.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      } else if(col==="workTasks"){
        items.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      } else {
        items.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      }
      state[key]=items;

      // Seed defaults on first run (admin only, if projects empty)
      if(col==="projects" && items.length===0 && isAdmin() && !state._seeded){
        state._seeded=true;
        await seedDefaults();
      }

      firstCount++;
      if(firstCount>=16 && !state.initialized){
        state.initialized=true;
        renderApp();
      } else if(state.initialized){
        renderTab();
      }
    },(err)=>{
      console.error(`${col} sync error:`,err);
      toast(`Sync error: ${col}`);
    });
    state.unsubs.push(unsub);
  });

  // WhatsApp settings (single doc)
  const waUnsub = onSnapshot(doc(db,"settings","whatsapp"),(snap)=>{
    state.waSettings = snap.exists() ? snap.data() : {
      enabledFields: ["employee","date","time","project","location","duration","resolutionText"],
      allowedRoles: ["admin"],
      triggers: ["daily","clientRequests"],
      messageHeader: "🔔 New Task — EJAF Operations",
    };
    if(state.initialized) renderTab();
  });
  state.unsubs.push(waUnsub);

  // Email settings (single doc)
  const emailUnsub = onSnapshot(doc(db,"settings","email"),(snap)=>{
    state.emailSettings = snap.exists() ? snap.data() : {
      enabled: false,
      serviceId: "", templateId: "", publicKey: "",
      enabledFields: ["employee","date","time","project","location","duration","resolutionText"],
      allowedRoles: ["admin"],
      triggers: ["daily","clientRequests"],
      subject: "New Task — EJAF Operations",
      autoSend: true, includeEmployees: false, includeClients: false, requestRecipients: [],
    };
    if(state.initialized) renderTab();
  });
  state.unsubs.push(emailUnsub);

  // Scheduled reports config
  const schedUnsub = onSnapshot(doc(db,"settings","scheduledReports"),(snap)=>{
    state.scheduledReports = snap.exists() ? snap.data() : {
      enabled: false,
      fromDate: "", toDate: "",
      sendTime: "23:30",
      sendDay: "1",
      recipients: [],
      subject: "EJAF Operations — Periodic Reports",
      message: "Please find attached the operations reports for the specified period.",
      reports: ["daily","hr","dashboard"],
      lastSent: "",
    };
    if(state.initialized) renderTab();
  });
  state.unsubs.push(schedUnsub);
}

async function seedDefaults(){
  const{db,doc,setDoc}=window.__fb;
  try{
    // Seed default departments
    const DEFAULT_DEPTS = [
      {id:"enterprise", name:"Enterprise", color:"#2E7D32"},
      {id:"security", name:"Security", color:"#E65100"},
      {id:"ejaf", name:"Ejaf", color:"#6A1B9A"},
    ];
    for(const d of DEFAULT_DEPTS){
      await setDoc(doc(db,"departments",d.id),{name:d.name,color:d.color});
    }
    for(const p of DEFAULT_PROJECTS){
      await setDoc(doc(db,"projects",p.id),{name:p.name,dept:p.dept});
    }
    for(const l of DEFAULT_LOCATIONS){
      await setDoc(doc(db,"locations",l.id),{name:l.name});
    }
    // Seed default work categories
    const DEFAULT_WORK_CATEGORIES = [
      {id:"enterprise_wi", name:"Enterprise", color:"#2E7D32", icon:"🏢"},
      {id:"security_wi",   name:"Security",   color:"#E65100", icon:"🔒"},
    ];
    for(const wc of DEFAULT_WORK_CATEGORIES){
      await setDoc(doc(db,"workCategories",wc.id),{name:wc.name,color:wc.color,icon:wc.icon});
    }
    toast("Defaults loaded ✓");
  }catch(e){console.error(e);}
}

async function fbSave(col,item){
  try{
    const{db,doc,setDoc}=window.__fb;
    const id=item.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    const data={...item};delete data.id;
    await setDoc(doc(db,col,id),data);
  }catch(e){console.error(e);toast("Save failed: "+e.message);}
}

async function fbDelete(col,id){
  try{
    const{db,doc,deleteDoc}=window.__fb;
    await deleteDoc(doc(db,col,id));
  }catch(e){console.error(e);toast("Delete failed");}
}

async function doSignIn(email,password){
  try{
    const{auth,signInWithEmailAndPassword}=window.__fb;
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    let msg="Sign in failed";
    if(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/user-not-found")msg="Invalid email or password";
    if(e.code==="auth/invalid-email")msg="Invalid email format";
    if(e.code==="auth/network-request-failed")msg="Network error — check connection";
    return msg;
  }
  return null;
}

async function doSignOut(){
  try{
    const{auth,signOut}=window.__fb;
    await releaseSession();  // free this device's session claim
    if(state._sessionUnsub){ try{state._sessionUnsub();}catch(e){} state._sessionUnsub=null; }
    cleanupSubs();
    await signOut(auth);
  }catch(e){console.error(e);}
}
window.doSignOut=doSignOut;

window.showForgotPassword = function(e){
  if(e) e.preventDefault();
  const email = prompt("Enter your email address:\n\nWe'll send you a password reset link.");
  if(!email) return;
  if(!email.includes('@')) { alert("Please enter a valid email address."); return; }
  sendResetEmail(email);
};

async function sendResetEmail(email){
  try {
    const { auth, sendPasswordResetEmail } = window.__fb;
    await sendPasswordResetEmail(auth, email.trim());
    alert(`✓ Password reset email sent!\n\nCheck your inbox at: ${email}\n\nIf you don't see it, check your Spam folder.`);
  } catch(e) {
    console.error(e);
    let msg = "Failed to send reset email";
    if(e.code === "auth/user-not-found") msg = "No account found with this email";
    if(e.code === "auth/invalid-email") msg = "Invalid email address";
    if(e.code === "auth/too-many-requests") msg = "Too many attempts. Try again later.";
    alert("❌ " + msg);
  }
}
window.sendResetEmail = sendResetEmail;

window.handleLogin=async function(e){
  e.preventDefault();
  const btn=$("loginBtn");
  const err=$("loginErr");
  err.innerHTML="";
  btn.disabled=true;btn.textContent="Signing in...";
  const msg=await doSignIn($("loginEmail").value.trim(),$("loginPass").value);
  if(msg){
    err.innerHTML=`<div class="login-err">${msg}</div>`;
    btn.disabled=false;btn.textContent="Sign In";
  }
};

function getTabs(){
  const role = getUserRole();
  // Client: portal view only
  if(role === "client"){
    const base = ["My Project","Requests","Profile"];
    if(!base.includes(state.tab)) state.tab = base[0];
    return base;
  }
  // IT role: highly restricted — only Dashboard, Work Instructions, Profile
  if(role === "it"){
    const base = ["Dashboard","Work Instructions","Profile"];
    if(!base.includes(state.tab)) state.tab = base[0];
    return base;
  }
  // Employee: own-data tabs only
  if(role === "employee"){
    const base = ["Dashboard","Daily Log","Overtime","Travel","Leaves","Work Instructions","Profile"];
    if(!base.includes(state.tab)) state.tab = base[0];
    return base;
  }
  // HR: full ops but no Users/Share/Clients
  if(role === "hr"){
    const base = ["Dashboard","Daily Log","Overtime","Travel","Leaves","Work Instructions",
                  "HR Report","Reports","Requests","Projects","Locations","Departments","Profile"];
    if(!base.includes(state.tab)) state.tab = base[0];
    return base;
  }
  // Support: full access except Users and Share
  if(role === "support"){
    const base = ["Dashboard","Daily Log","Overtime","Travel","Leaves","Work Instructions",
                  "HR Report","Reports","Requests","Projects","Locations","Departments","Profile"];
    if(!base.includes(state.tab)) state.tab = base[0];
    return base;
  }
  // Admin / Owner: everything
  const base = ["Dashboard","Daily Log","Overtime","Travel","Leaves","Work Instructions",
                "HR Report","Reports","Requests","Clients","Projects","Locations","Departments","Users","WhatsApp","Email","Share","Profile"];
  if(!base.includes(state.tab)) state.tab = base[0];
  return base;
}

// Pending request count for notification badge
function pendingRequestCount(){
  if(isClient()){
    // Client sees count of their requests with status changes? Keep simple: no badge for client
    return 0;
  }
  return (state.clientRequests||[]).filter(r=>r.status==="new").length;
}

window.switchTab=function(t){
  state.tab=t;
  // Update the active class on the tab buttons WITHOUT rebuilding the header
  // (renderTab only swaps #content, so we must toggle classes here ourselves)
  const bar = document.getElementById("tabBar");
  if(bar){
    bar.querySelectorAll(".tab").forEach(btn=>{
      btn.classList.toggle("active", btn.getAttribute("data-tab")===t);
    });
  }
  renderTab();
  window.scrollTo(0,0);
  // Slide the gold indicator to the new active tab
  positionTabIndicator();
};

// Move the gold underline to sit under the active tab
function positionTabIndicator(){
  const bar = document.getElementById("tabBar");
  const ind = document.getElementById("tabIndicator");
  if(!bar || !ind) return;
  const active = bar.querySelector(".tab.active");
  if(!active){ ind.style.width="0"; return; }
  // offsetLeft/offsetWidth are relative to the scrollable nav — correct even when scrolled
  ind.style.left  = active.offsetLeft + "px";
  ind.style.width = active.offsetWidth + "px";
  // Bring the active tab into view if it's off-screen horizontally
  const barRect = bar.getBoundingClientRect();
  const tabRect = active.getBoundingClientRect();
  if(tabRect.right > barRect.right || tabRect.left < barRect.left){
    active.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  }
}
window.positionTabIndicator = positionTabIndicator;

// Keep the gold indicator aligned on screen resize / rotation and after scroll
window.addEventListener("resize", ()=>{ positionTabIndicator(); });

function renderTab(){
  const c=$("content");
  if(!c)return;

  // Security guard: enforce per-role tab access
  const role = getUserRole();
  if(role === "client"){
    // Client: only portal tabs
    if(!["My Project","Requests","Profile"].includes(state.tab)) state.tab="My Project";
  } else if(role === "it"){
    // IT: only dashboard, work instructions, profile
    if(!["Dashboard","Work Instructions","Profile"].includes(state.tab)) state.tab="Dashboard";
  } else if(role === "employee"){
    // Employee: no HR/admin tabs
    if(["HR Report","Reports","Requests","Clients","Projects","Locations","Departments","Users","Share","WhatsApp","Email"].includes(state.tab)) state.tab="Dashboard";
  } else if(role === "support" || role === "hr"){
    // Support/HR: no Users, Share, or Clients management
    if(["Users","Share","Clients","WhatsApp","Email"].includes(state.tab)) state.tab="Dashboard";
  }

  const fn={
    "Dashboard":renderDashboard,"Daily Log":renderDailyLog,"Overtime":renderOvertime,
    "Travel":renderTravel,"Leaves":renderLeaves,"HR Report":renderHRReport,"Reports":renderFlexReports,
    "Projects":renderProjects,"Locations":renderLocations,"Users":renderUsers,
    "Departments":renderDepartments,"Work Instructions":renderWorkInstructions,
    "Share":renderShare,"Profile":renderProfile,
    "Clients":renderClients,"Requests":renderRequests,"My Project":renderClientPortal,
    "WhatsApp":renderWhatsApp,
    "Email":renderEmailTab,
  }[state.tab]||(isClient()?renderClientPortal:renderDashboard);
  c.innerHTML=fn();
}
window.render=renderTab;

// ═══ PERIOD / DATE-RANGE SYSTEM ═══
// Stored as two real dates (ISO yyyy-mm-dd) in localStorage.
// Empty = no filter (show all). The label is derived from the dates.
function getPeriodFrom(){ return localStorage.getItem("opt_period_from") || ""; }
function getPeriodTo(){   return localStorage.getItem("opt_period_to")   || ""; }
function setPeriodRange(from, to){
  if(from) localStorage.setItem("opt_period_from", from); else localStorage.removeItem("opt_period_from");
  if(to)   localStorage.setItem("opt_period_to", to);     else localStorage.removeItem("opt_period_to");
}
// Human-readable label for the header and reports
function getPeriod(){
  const f = getPeriodFrom(), t = getPeriodTo();
  if(!f && !t) return defaultPeriod();
  const fmt = (s)=>{ if(!s) return "…"; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
  if(f && t) return `${fmt(f)} → ${fmt(t)}`;
  if(f) return `From ${fmt(f)}`;
  return `Until ${fmt(t)}`;
}
function defaultPeriod(){
  const d=new Date();
  return d.toLocaleDateString("en-US",{month:"long",year:"numeric"});
}
// Legacy setter kept for compatibility (no-op text path)
function setPeriod(v){ /* replaced by setPeriodRange */ }

// ── CENTRAL DATE FILTER ──
// Returns true if a record's date falls within the active period range.
// Records without dates pass only when no filter is active.
function inActivePeriod(dateStr){
  const f = getPeriodFrom(), t = getPeriodTo();
  if(!f && !t) return true;        // no filter → everything passes
  if(!dateStr) return false;       // filtered but record has no date
  const d = String(dateStr).slice(0,10);
  if(f && d < f) return false;
  if(t && d > t) return false;
  return true;
}
// Apply the active period filter to an array of records (by their .date field)
function filterByPeriod(rows, dateField="date"){
  const f = getPeriodFrom(), t = getPeriodTo();
  if(!f && !t) return rows;
  return rows.filter(r=>inActivePeriod(r[dateField]));
}

window.editPeriod=function(e){
  if(e) e.stopPropagation();
  openPeriodDialog();

window.applyPeriodPreset=function(which){
  const now=new Date();
  let from, to;
  if(which==="thisMonth"){
    from=new Date(now.getFullYear(),now.getMonth(),1);
    to=new Date(now.getFullYear(),now.getMonth()+1,0);
  } else if(which==="lastMonth"){
    from=new Date(now.getFullYear(),now.getMonth()-1,1);
    to=new Date(now.getFullYear(),now.getMonth(),0);
  } else if(which==="thisYear"){
    from=new Date(now.getFullYear(),0,1);
    to=new Date(now.getFullYear(),11,31);
  }
  const iso=(d)=>d.toISOString().slice(0,10);
  const fEl=document.getElementById("pdFrom"), tEl=document.getElementById("pdTo");
  if(fEl) fEl.value=iso(from);
  if(tEl) tEl.value=iso(to);
};

  setPeriodRange(f, t);

};

  setPeriodRange("", "");

  renderApp();
  toast("Showing all dates");
};

// Get user's GPS position. Returns {lat, lng, accuracy} or {denied:true}
function captureGPS(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){
      resolve({denied:true, reason:"GPS not supported on this device"});
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        resolve({
          lat: +pos.coords.latitude.toFixed(6),
          lng: +pos.coords.longitude.toFixed(6),
          accuracy: Math.round(pos.coords.accuracy||0)
        });
      },
      (err)=>{
        resolve({denied:true, reason: err.code===1 ? "Location permission denied" : "Location unavailable"});
      },
      {enableHighAccuracy:true, timeout:10000, maximumAge:60000}
    );
  });
}
function gpsMapLink(lat,lng){
  return `https://www.google.com/maps?q=${lat},${lng}`;
}
function gpsBadgeHTML(r){
  if(r.gpsLat && r.gpsLng){

  }
  return '';
}

// Returns next entry number based on current max in state.daily
function getNextDailyEntryNo(){
  if(!state.daily || state.daily.length === 0) return 1;
  const nums = state.daily
    .map(r => parseInt(r.entryNo || 0))
    .filter(n => !isNaN(n) && n > 0);
  return nums.length > 0 ? Math.max(...nums) + 1 : state.daily.length + 1;
}
function formatEntryNo(n){
  return String(n).padStart(3, "0");
}

// Assign entry numbers to existing entries that don't have one
// Called once by admin from Profile — sorts by date then assigns 001,002...
async function assignEntryNumbersToExisting(){
  const {db, doc, setDoc} = window.__fb;
  if(!db) return toast("Database not ready");
  const sorted = [...state.daily].sort((a,b)=>{
    const d = (a.date||"").localeCompare(b.date||"");
    if(d !== 0) return d;
    return (a.start||"").localeCompare(b.start||"");
  });
  let count = 0;
  for(let i = 0; i < sorted.length; i++){
    const r = sorted[i];
    if(!r.entryNo){
      const data = {...r};
      const id = data.id; delete data.id;
      data.entryNo = i + 1;
      await setDoc(doc(db, "daily", id), data, {merge: true});
      count++;
    }
  }
  toast(`Assigned numbers to ${count} entries ✓`);
}

// Reset daily entry counter (sets all entries to re-number from 1 on next assignEntryNumbers call)
async function resetDailyEntryCounter(){
  if(!isAdmin()) return;
  if(!confirm("Reset daily entry counter?\n\nThis will remove numbering from all entries. Use \"Assign Numbers\" after to re-number from 001.")) return;
  const {db, doc, updateDoc, deleteField} = window.__fb;
  if(!updateDoc || !deleteField){
    toast("Update function not available — please refresh");
    return;
  }
  let count = 0;
  for(const r of state.daily){
    if(r.entryNo){
      await updateDoc(doc(db, "daily", r.id), { entryNo: deleteField() });
      count++;
    }
  }
  toast(`Numbers removed from ${count} entries ✓ — use Assign Numbers to re-number`);
}

async function generateRefNo(reportType="GENERAL"){
  try{
    const {db, doc, getDoc, setDoc, runTransaction, collection, addDoc} = window.__fb;
    if(!db) throw new Error("db not ready");

    const year = new Date().getFullYear();
    const counterRef = doc(db, "reportCounters", String(year));

    // Use transaction to safely increment
    const n = await runTransaction(db, async(tx) => {
      const snap = await tx.get(counterRef);
      const stored = snap.exists() ? snap.data() : {};
      const storedYear = stored.year || 0;
      const current = (storedYear === year) ? (stored.count || 0) : 0;
      const next = current + 1;
      tx.set(counterRef, { count: next, year: year });
      return next;
    });

    const refNo = `RPT-${year}-${String(n).padStart(4,"0")}`;

    // Log silently — never block export
    addDoc(collection(db, "reportLog"), {
      refNo, reportType,
      exportedBy:     state.user?.email,
      exportedByName: state.profile?.name || state.profile?.employeeName,
      period:         getPeriod()
    }).catch(()=>{});

    return refNo;

  } catch(e) {
    console.error("generateRefNo failed:", e.message);
    return `RPT-${new Date().getFullYear()}-ERR (check Firestore rules)`;
  }
}

function csvEscape(v){
  if(v==null) return "";
  const s=String(v);
  if(s.includes(",")||s.includes("\"")||s.includes("\n")) return `"${s.replace(/"/g,'""')}"`;
  return s;
}

function downloadFile(filename, content, mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}

    lines.push([r.date,r.employee,r.project,r.dept,r.start,r.end,fmtHM(r.duration),r.notes||""].map(csvEscape).join(","));

  lines.push("");

  // Overtime

  lines.push("OVERTIME LOG");
  lines.push(["Date","Day","Employee","Start","End","Hours","Project","Department","Location","Notes"].map(csvEscape).join(","));

    lines.push([r.date,r.day||"",r.employee,r.start||"",r.end||"",fmtHM(r.hours),r.project||"",r.dept||"",r.location||"",r.notes||""].map(csvEscape).join(","));

  downloadFile(`OpsDeptTrack_${period}_${today}.csv`, content, "text/csv;charset=utf-8");
  toast("Excel CSV downloaded ✓");

function summary(){
  const allEmps = isEmployee()?[state.profile.employeeName]:allEmployees();
  // Apply global filter: if filter is set, only include those employees
  const sel = state.globalEmployeeFilter || [];
  const emps = (sel.length > 0 && !isEmployee()) ? allEmps.filter(e => sel.includes(e)) : allEmps;
  const depts = deptNames();
  return emps.filter(Boolean).map(emp=>{
    const d=applyReportFilters(state.daily).filter(r=>r.employee===emp);
    const o=applyReportFilters(state.overtime).filter(r=>r.employee===emp);
    const t=applyReportFilters(state.travel).filter(r=>r.employee===emp);
    const lv=applyReportFilters(state.leaves,"from").filter(r=>r.employee===emp);
    // Build per-department hours object dynamically
    const byDept = {};
    let total = 0;
    depts.forEach(dn => {
      const h = d.filter(r=>r.dept===dn).reduce((s,r)=>s+Number(r.duration||0),0);
      byDept[dn] = h;
      total += h;
    });
    // legacy fields for backwards compatibility
    const ent = byDept["Enterprise"] || 0;
    const sec = byDept["Security"] || 0;
    const eja = byDept["Ejaf"] || 0;
    const ot=o.reduce((s,r)=>s+Number(r.hours||0),0);
    const tDays=t.reduce((s,r)=>s+Number(r.days||0),0);
    const pd=t.reduce((s,r)=>s+Number(r.perDiem||0),0);
    // Leave breakdown — robust calculation handling all kinds
    // Priority: 1) saved days field, 2) saved hours/9, 3) compute from kind
    const leaveDays = lv.reduce((sum, r) => {
      // If days field exists and is valid, use it
      if(r.days !== undefined && r.days !== null && !isNaN(Number(r.days))){
        return sum + Number(r.days);
      }
      // Else if hours field exists, convert
      if(r.hours !== undefined && r.hours !== null && !isNaN(Number(r.hours))){
        return sum + (Number(r.hours) / WORK_HOURS_PER_DAY);
      }
      // Else compute from leave structure
      const amt = computeLeaveAmount(r);
      return sum + amt.days;
    }, 0);
    const leaveBreakdown = {};
    LEAVE_TYPES.forEach(lt => {
      const items = lv.filter(r=>r.type===lt.id);
      leaveBreakdown[lt.id] = items.reduce((sum, r) => {
        if(r.days !== undefined && r.days !== null && !isNaN(Number(r.days))) return sum + Number(r.days);
        if(r.hours !== undefined && r.hours !== null && !isNaN(Number(r.hours))) return sum + (Number(r.hours) / WORK_HOURS_PER_DAY);
        return sum + computeLeaveAmount(r).days;
      }, 0);
    });
    return{emp,byDept,ent,sec,eja,total,ot,tDays,pd,sessions:d.length,leaveDays,leaveBreakdown};
  });
}

function donutSVG(slices,total){
  if(total===0){
    return `<svg class="donut-svg" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="80" fill="none" stroke="#E0E8F0" stroke-width="32"/>
      <text x="100" y="105" text-anchor="middle" font-family="DM Serif Display" font-size="22" fill="#6B7B8F">No Data</text></svg>`;
  }
  const r=80,cx=100,cy=100;
  let cum=-Math.PI/2;
  const segs=slices.filter(s=>s.value>0).map(s=>{
    const a=(s.value/total)*Math.PI*2;
    const x1=cx+r*Math.cos(cum),y1=cy+r*Math.sin(cum);
    cum+=a;
    const x2=cx+r*Math.cos(cum),y2=cy+r*Math.sin(cum);
    const large=a>Math.PI?1:0;
    return `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${s.color}" stroke="white" stroke-width="2"/>`;
  }).join("");
  return `<svg class="donut-svg" viewBox="0 0 200 200">${segs}
    <circle cx="${cx}" cy="${cy}" r="48" fill="white"/>
    <text x="100" y="95" text-anchor="middle" font-family="DM Serif Display" font-size="20" fill="#1B3A6B" font-weight="700">${fmtHM(total)}</text>
    <text x="100" y="115" text-anchor="middle" font-family="Inter" font-size="10" fill="#6B7B8F" letter-spacing="1">TOTAL HOURS</text></svg>`;
}

async function saveDaily(){
  // Specific validation messages — tell the user exactly what's missing
  if(isEmployee() && !state.profile.employeeName){
    return toast("⚠ Your account has no employee profile — contact your admin");
  }
  if(!dailyForm.employee) return toast("⚠ Employee field is empty");
  if(!dailyForm.date)     return toast("⚠ Date is required");
  if(!dailyForm.project)  return toast("⚠ Please select a Project");
  if(!dailyForm.location) return toast("⚠ Please select a Location");

  // ── Per-employee permission checks ──
  // Admin: resolution photos optional always. Employee: depends on their permission record.
  const perms = getEmpPermissions(dailyForm.employee);

  // Resolution validation for new entries
  if(!dailyEditId){
    const txt = (dailyForm.resolutionText||"").trim();
    if(isAdmin()){
      // Admin: text optional too if resolution not strictly needed — keep min text rule relaxed
      if(txt.length > 0 && txt.length < 10) return toast("Resolution description too short (min 10 chars)");
    } else if(perms.resolutionRequired){
      if(txt.length < 10) return toast("Resolution description required (min 10 chars)");
      if(!dailyForm.resolutionImages || dailyForm.resolutionImages.length < 1){
        return toast("At least 1 resolution photo is required");
      }
    }
  }

  // Strict employee guard: force own name on save (defense in depth)
  if(isEmployee()){
    dailyForm.employee = state.profile.employeeName;  // force override (validated above)
  }

  // ── GPS capture (new entries only) ──
  // Admin: GPS never forced. Employee: captured based on permission (but save allowed even if denied)
  let gpsData = {};
  if(!dailyEditId && !isAdmin() && perms.gpsRequired){
    toast("📡 Capturing GPS location...");
    const gps = await captureGPS();
    if(gps.denied){
      gpsData = { gpsDenied: gps.reason || "Location denied" };
      toast("⚠ Location unavailable — entry saved with 'GPS denied' note");
    } else {
      gpsData = { gpsLat: gps.lat, gpsLng: gps.lng, gpsAccuracy: gps.accuracy };
    }
  }

  // Auto-assign entry number for new entries only
  const entryNoToSave = dailyEditId ? undefined : getNextDailyEntryNo();
  const savedRecord = {
    ...dailyForm,
    duration:+timeToHrs(dailyForm.start,dailyForm.end).toFixed(4),
    dept:projDept(dailyForm.project),
    ...(entryNoToSave ? {entryNo: entryNoToSave} : {}),
  };
  const isNewDailyEntry = !dailyEditId;
  await fbSave("daily",{
    id:dailyEditId||undefined,
    ...savedRecord,
    createdBy:state.profile.uid,
    ...gpsData,
  });
  dailyForm=null;dailyEditId=null;
  toast("Saved ✓");
  // WhatsApp stays manual (📲 button per row).
  // Email logic:
  //  - If a "Save & Add" sequence is in progress, this entry is the FINAL one:
  //    add it to the buffer and send ONE combined email for all employees now.
  //  - Otherwise, send a single auto-email for just this entry.
  if(isNewDailyEntry && (emailGetSettings().triggers||[]).includes("daily")){
    if(_emailBuffer.length > 0){
      _emailBuffer.push(savedRecord);          // include this last employee
      if(_emailBufferTimer){ clearTimeout(_emailBufferTimer); _emailBufferTimer = null; }
      flushTaskEmailBuffer();                  // combined email, immediately
    } else {
      autoSendTaskEmail(savedRecord);          // single-entry email
    }
  }
}

// ── Combined email buffer for "Save & Add for Another Employee" ──
// Collects entries, then sends ONE email listing all employees after a pause.
let _emailBuffer = [];
let _emailBufferTimer = null;
function bufferTaskEmail(record){
  _emailBuffer.push(record);
  if(_emailBufferTimer) clearTimeout(_emailBufferTimer);
  // Fallback: if the user never clicks the final "Add Work Entry", send the
  // combined email automatically 60s after the last "Save & Add".
  _emailBufferTimer = setTimeout(flushTaskEmailBuffer, 60000);
  toast(`📧 ${_emailBuffer.length} employee(s) queued — click "Add Work Entry" for the last one to send the combined email`);
}
async function flushTaskEmailBuffer(){
  if(_emailBuffer.length === 0) return;
  const entries = _emailBuffer.slice();
  _emailBuffer = [];
  if(_emailBufferTimer){ clearTimeout(_emailBufferTimer); _emailBufferTimer = null; }

  const s = emailGetSettings();
  if(!s.enabled || !s.autoSend) return;
  if(!s.serviceId || !s.templateId || !s.publicKey) return;
  if(typeof emailjs === "undefined") return;
  const recipients = resolveEmailRecipients();
  if(recipients.length === 0) return;

  // Build a combined body: shared task details + list of all employees
  const first = entries[0];
  const names = entries.map(e=>e.employee).filter(Boolean);
  const combined = { ...first, employee: names.join(", ") };
  const body = buildEmailBodyAuto(combined);

  try{
    emailjs.init({publicKey:s.publicKey});
    let sent = 0;
    for(const r of recipients){
      await emailjs.send(s.serviceId, s.templateId, {
        subject: s.subject || "New Task — EJAF Operations",
        message: body,
        to_email: r.email,
      });
      sent++;
    }
    toast(`📧 Combined email (${names.length} employees) sent to ${sent} recipient${sent>1?'s':''}`);
  }catch(e){
    toast("Auto-email failed: " + (e.text||e.message||"check setup"));
  }
}
window.flushTaskEmailBuffer = flushTaskEmailBuffer;

async function handleResolutionImages(fileList){
  if(!fileList || fileList.length === 0) return;
  const current = dailyForm.resolutionImages || [];
  const remaining = 3 - current.length;
  if(remaining <= 0){
    toast("Maximum 3 images reached. Remove one first.");
    return;
  }
  const filesToProcess = Array.from(fileList).slice(0, remaining);
  toast(`Compressing ${filesToProcess.length} image(s)...`);
  try{
    for(const file of filesToProcess){
      // Reject files over 10MB raw (would be too slow to compress on phone)
      if(file.size > 10 * 1024 * 1024){
        toast(`${file.name} too large (max 10MB)`); continue;
      }
      const base64 = await compressImage(file, 1024, 0.6);
      const sizeKB = base64SizeKB(base64);
      if(sizeKB > 500){
        toast(`Image too large after compression (${sizeKB} KB). Skipped.`); continue;
      }
      current.push({ data: base64, sizeKB, addedAt: new Date().toISOString() });
    }
    dailyForm.resolutionImages = current;
    // Clear file input
    const inp = document.getElementById('resImageInput');
    if(inp) inp.value = '';
    render();
    toast(`✓ ${current.length} image(s) ready`);
  }catch(e){
    console.error(e);
    toast("Image processing failed: " + e.message);
  }
}

function removeResolutionImage(index){

}

// Bulk-purge resolution images older than N months (Admin only)
async function purgeResolutionImagesCustom(){
  if(!isAdmin()) return toast("Admin only");
  const from = document.getElementById("purgeFrom")?.value || "";
  const to   = document.getElementById("purgeTo")?.value   || "";
  const proj = document.getElementById("purgeProject")?.value || "";
  if(!from && !to && !proj){
    return toast("Select at least a date range or project");
  }
  const candidates = state.daily.filter(r => {
    if((r.resolutionImages||[]).length === 0) return false;
    if(from && (r.date||"") < from) return false;
    if(to   && (r.date||"") > to)   return false;
    if(proj && r.project !== proj)  return false;
    return true;
  });
  if(candidates.length === 0){
    return toast("No matching records with images found");
  }
  const desc = [
    from||to ? `Period: ${from||"start"} → ${to||"today"}` : "",
    proj ? `Project: ${proj}` : ""
  ].filter(Boolean).join("\n");
  if(!confirm(`Purge images from ${candidates.length} record(s)?\n${desc}\n\nText descriptions will be kept.\nThis cannot be undone.`)) return;
  let cleaned = 0;
  for(const rec of candidates){
    await fbSave("daily", { ...rec, id: rec.id, resolutionImages: [] });
    cleaned++;
  }
  toast(`✓ Cleaned ${cleaned} record(s) — space freed`);
}

let leaveForm = null, leaveEditId = null, leaveFilter = "";

const LEAVE_TYPES = [
  {id:"annual", label:"Annual Leave", color:"#2E7D32"},
  {id:"sick", label:"Sick Leave", color:"#C62828"},
  {id:"unpaid", label:"Unpaid Leave", color:"#6B7B8F"},
  {id:"emergency", label:"Emergency", color:"#E65100"},
  {id:"maternity", label:"Maternity/Paternity", color:"#6A1B9A"},
  {id:"other", label:"Other", color:"#1565C0"},
];

// Work day configuration (used for sub-day leave conversions)
const WORK_HOURS_PER_DAY = 9;       // 8:30 → 17:30 = 9 hours
const HALF_DAY_FIRST_START = "08:30";
const HALF_DAY_FIRST_END   = "13:00";
const HALF_DAY_SECOND_START= "13:00";
const HALF_DAY_SECOND_END  = "17:30";
const HALF_DAY_HOURS = 4.5;          // each half = 4.5 hours

function leaveTypeInfo(id){
  return LEAVE_TYPES.find(t=>t.id===id) || LEAVE_TYPES[LEAVE_TYPES.length-1];
}

function leaveTypeBadge(type){
  const t = leaveTypeInfo(type);
  return `<span style="background:${t.color}22;color:${t.color};padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px">${t.label}</span>`;
}

function daysBetween(from, to){
  if(!from || !to) return 0;
  const d1 = new Date(from), d2 = new Date(to);
  const diff = Math.round((d2 - d1) / (1000*60*60*24)) + 1;
  return Math.max(0, diff);
}

// Compute total hours for a leave entry based on its kind
// Returns { hours, days } where days = hours / WORK_HOURS_PER_DAY
function computeLeaveAmount(leave){
  const kind = leave.kind || "full";
  if(kind === "full"){
    const days = daysBetween(leave.from, leave.to);
    return { hours: days * WORK_HOURS_PER_DAY, days: days, label: `${days} day${days===1?'':'s'}` };
  }
  if(kind === "half"){
    const halfLabel = leave.halfPart === "second" ? "Second Half (13:00-17:30)" : "First Half (08:30-13:00)";
    return { hours: HALF_DAY_HOURS, days: HALF_DAY_HOURS / WORK_HOURS_PER_DAY, label: halfLabel };
  }
  if(kind === "hourly"){
    const h = timeToHrs(leave.startTime, leave.endTime);
    return { hours: h, days: h / WORK_HOURS_PER_DAY, label: `${leave.startTime || '?'} → ${leave.endTime || '?'} (${fmtHM(h)})` };
  }
  return { hours: 0, days: 0, label: "" };
}

function leaveKindBadge(kind){
  const map = {
    full:    { label: "Full Day",  color: "#2E7D32" },
    half:    { label: "Half Day",  color: "#E65100" },
    hourly:  { label: "Hourly",    color: "#1565C0" },
  };
  const m = map[kind || "full"];
  return `<span style="background:${m.color}22;color:${m.color};padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px">${m.label}</span>`;
}

async function saveLeave(){
  if(!leaveForm.employee)return toast("Employee required");
  // Strict employee guard: force own name on save
  if(isEmployee()){
    if(!state.profile.employeeName) return toast("Your account has no employee profile. Contact admin.");
    leaveForm.employee = state.profile.employeeName;
  }
  const kind = leaveForm.kind || "full";
  if(kind === "full"){
    if(!leaveForm.from || !leaveForm.to) return toast("From and To dates required");
    if(leaveForm.from > leaveForm.to) return toast("From date must be before To date");
  } else if(kind === "half"){
    if(!leaveForm.from) return toast("Date required");
    leaveForm.to = leaveForm.from;
    if(!leaveForm.halfPart) leaveForm.halfPart = "first";
  } else if(kind === "hourly"){
    if(!leaveForm.from) return toast("Date required");
    if(!leaveForm.startTime || !leaveForm.endTime) return toast("Start and End times required");
    if(leaveForm.startTime >= leaveForm.endTime) return toast("End must be after Start");
    leaveForm.to = leaveForm.from;
  }
  const amount = computeLeaveAmount(leaveForm);
  await fbSave("leaves", {
    id: leaveEditId || undefined,
    ...leaveForm,
    hours: amount.hours,
    days: amount.days,
    createdBy: state.profile.uid,
  });
  leaveForm = null; leaveEditId = null;
  toast(leaveEditId ? "Updated ✓" : "Added ✓");
}
async function saveLeaveAndNext(){
  if(!leaveForm.employee)return toast("Employee required");
  if(isEmployee()) return toast("Use Save for single entry");
  const kind = leaveForm.kind || "full";
  if(kind === "full"){
    if(!leaveForm.from || !leaveForm.to) return toast("From and To dates required");
    if(leaveForm.from > leaveForm.to) return toast("From date must be before To date");
  } else if(kind === "half"){
    if(!leaveForm.from) return toast("Date required");
    leaveForm.to = leaveForm.from;
  } else if(kind === "hourly"){
    if(!leaveForm.from) return toast("Date required");
    if(!leaveForm.startTime || !leaveForm.endTime) return toast("Start and End times required");
    if(leaveForm.startTime >= leaveForm.endTime) return toast("End must be after Start");
    leaveForm.to = leaveForm.from;
  }
  const amount = computeLeaveAmount(leaveForm);
  await fbSave("leaves", {
    id: undefined,
    ...leaveForm,
    hours: amount.hours,
    days: amount.days,
    createdBy: state.profile.uid,
  });
  const savedEmp = leaveForm.employee;
  leaveForm = {...leaveForm, employee:""};
  render();
  toast(`Saved for ${savedEmp} ✓ — Select next employee`);
}
function editLeave(id){
  const r = state.leaves.find(x=>x.id===id);
  if(r){
    // Ensure backward compatibility - older entries won't have kind/hours
    const leave = {...r, kind: r.kind || "full"};
    if(!leave.startTime) leave.startTime = "10:00";
    if(!leave.endTime) leave.endTime = "12:00";
    if(!leave.halfPart) leave.halfPart = "first";
    leaveForm = leave;
    leaveEditId = id;
    render();
    window.scrollTo(0,0);
  }
}
async function delLeave(id){
  if(confirm("Delete this leave entry?")){ await fbDelete("leaves", id); toast("Deleted"); }
}
function cancelLeave(){ leaveForm = null; leaveEditId = null; render(); }
Object.assign(window, {saveLeave, saveLeaveAndNext, editLeave, delLeave, cancelLeave});
Object.defineProperty(window, 'leaveForm', {get:()=>leaveForm, set:v=>leaveForm=v, configurable:true});

}
async function saveProj(){
  const cleanName = (projForm.name||"").trim();
  if(!cleanName)return toast("Name required");
  if(!projEditId&&state.projects.find(p=>(p.name||"").trim()===cleanName))return toast("Already exists");
  const id=projEditId||cleanName.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  if(!id)return toast("Invalid name — use letters/numbers");

  // ── Cascade rename if name changed (Admin only) ──
  let oldName = null;
  if(projEditId){
    const existing = state.projects.find(p=>p.id===projEditId);
    if(existing && existing.name !== cleanName) oldName = existing.name;
  }
  if(oldName && !isAdmin()) return toast("Only Admin can rename projects");
  if(oldName){
    const affected = state.daily.filter(r=>r.project===oldName).length
      + state.overtime.filter(r=>r.project===oldName).length
      + state.travel.filter(r=>r.project===oldName).length;
    if(affected > 0 && !confirm(`Rename "${oldName}" → "${cleanName}"?\n\nThis will update ${affected} record(s) across Daily Log, Overtime, and Travel, plus client assignments.\n\nThis cannot be undone.`)) return;
  }

  await fbSave("projects",{id,name:cleanName,dept:projForm.dept,estimatedHours:Number(projForm.estimatedHours||0)});

  if(oldName){
    const synced = await cascadeRenameProject(oldName, cleanName);
    toast(`✓ Renamed & synced ${synced} record(s)`);
  } else {
    toast("Saved ✓");
  }
  projForm=null;projEditId=null;
}
function editProj(id){const r=state.projects.find(p=>p.id===id);if(r){projForm={...r};projEditId=id;render();window.scrollTo(0,0);}}
async function delProj(id){if(confirm("Delete?")){await fbDelete("projects",id);toast("Deleted");}}
function cancelProj(){projForm=null;projEditId=null;render();}
Object.assign(window,{saveProj,editProj,delProj,cancelProj});
Object.defineProperty(window,'projForm',{get:()=>projForm,set:v=>projForm=v});

    <div class="sec-hdr">${locEditId?"Edit":"Add"} Location</div>
    <div class="form-grid full">
      <div class="field"><label>City Name <span class="req">*</span></label>
        <input value="${escapeHtml(locForm)}" oninput="window.locForm=this.value" placeholder="e.g. Mosul"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveLoc()">${locEditId?"Update":"Add"}</button>
      ${locEditId?`<button class="btn btn-ghost" onclick="cancelLoc()">Cancel</button>`:""}
    </div>
  </div>
  <div class="card">
    <div class="card-title">Locations · ${state.locations.length}</div>
    <div class="proj-chips">${state.locations.map(l=>`<span class="proj-chip">📍 ${escapeHtml(l.name)}
      <button class="btn btn-sm btn-secondary" onclick="editLoc('${l.id}')" style="padding:2px 6px">✎</button>
      <button class="btn btn-sm btn-danger" onclick="delLoc('${l.id}')" style="padding:2px 6px">🗑</button></span>`).join("")}</div>
  </div>`;
}
async function saveLoc(){
  const name=(locForm||"").trim();
  if(!name)return toast("City name required");
  if(!locEditId&&state.locations.find(l=>(l.name||"").trim()===name))return toast("Already exists");
  const id=locEditId||name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  if(!id)return toast("Invalid name");

  // ── Cascade rename if name changed (Admin only) ──
  let oldName = null;
  if(locEditId){
    const existing = state.locations.find(l=>l.id===locEditId);
    if(existing && existing.name !== name) oldName = existing.name;
  }
  if(oldName && !isAdmin()) return toast("Only Admin can rename locations");
  if(oldName){
    const affected = state.daily.filter(r=>r.location===oldName).length
      + state.overtime.filter(r=>r.location===oldName).length
      + state.travel.filter(r=>r.location===oldName).length;
    if(affected > 0 && !confirm(`Rename "${oldName}" → "${name}"?\n\nThis will update ${affected} record(s).\n\nThis cannot be undone.`)) return;
  }

  await fbSave("locations",{id,name});

  if(oldName){
    const synced = await cascadeRenameLocation(oldName, name);
    toast(`✓ Renamed & synced ${synced} record(s)`);
  } else {
    toast("Saved ✓");
  }
  locForm="";locEditId=null;
}
function editLoc(id){const r=state.locations.find(l=>l.id===id);if(r){locForm=r.name;locEditId=id;render();window.scrollTo(0,0);}}
async function delLoc(id){if(confirm("Delete?")){await fbDelete("locations",id);toast("Deleted");}}
function cancelLoc(){locForm="";locEditId=null;render();}
Object.assign(window,{saveLoc,editLoc,delLoc,cancelLoc});
Object.defineProperty(window,'locForm',{get:()=>locForm,set:v=>locForm=v});

async function saveUser(){
  if(!userForm.name.trim()||!userForm.email.trim())return toast("Name and email required");

  // Build user data with proper isTrackedEmployee handling
  const role = userForm.role;
  const isEmp = role === "employee";
  // For HR/admin: only include employeeName if explicitly tracked
  const trackedName = isEmp ? (userForm.employeeName||userForm.name) : (userForm.isTrackedEmployee ? userForm.employeeName : "");
  const userData = {
    name:userForm.name,
    email:userForm.email,
    role:role,
    employeeName: trackedName,
    isTrackedEmployee: isEmp ? true : !!userForm.isTrackedEmployee,
  };

  if(userEditId){
    // Update existing user profile (not auth account)
    try{
      const{db,doc,setDoc}=window.__fb;
      await setDoc(doc(db,"users",userEditId), userData, {merge:true});
      userForm=null;userEditId=null;toast("Updated ✓");
    }catch(e){console.error(e);toast("Update failed");}
    return;
  }

  // Create new auth user + Firestore profile
  if(!userForm.password||userForm.password.length<6)return toast("Password must be 6+ chars");
  if(!userForm.adminPassword||userForm.adminPassword.length<6)return toast("Enter YOUR (admin) password to confirm");

  try{
    const{auth,createUserWithEmailAndPassword,signInWithEmailAndPassword,db,doc,setDoc}=window.__fb;
    const adminEmail = state.profile.email;
    const adminPassword = userForm.adminPassword;

    // Step 1: Create the new auth user (auto-signs us in as the new user)
    const cred = await createUserWithEmailAndPassword(auth, userForm.email, userForm.password);
    const newUid = cred.user.uid;

    // Step 2: Sign back in as admin (required so Firestore Rules accept the write)
    await signInWithEmailAndPassword(auth, adminEmail, adminPassword);

    // Step 3: Now write the user profile as admin
    await setDoc(doc(db,"users",newUid), userData);

    toast(`✓ User created successfully`);
    userForm=null;
  }catch(e){
    console.error(e);
    let msg="Create failed";
    if(e.code==="auth/email-already-in-use")msg="Email already registered";
    if(e.code==="auth/weak-password")msg="Password too weak (need 6+ chars)";
    if(e.code==="auth/wrong-password"||e.code==="auth/invalid-credential")msg="Wrong admin password";
    toast(msg);
  }
}

function editUser(id){
  const u=state.users.find(x=>x.id===id);
  if(u){userForm={name:u.name||"",email:u.email||"",password:"",role:u.role||"employee",employeeName:u.employeeName||""};userEditId=id;render();window.scrollTo(0,0);}
}

async function delUser(id){
  if(!confirm("Delete this user profile? (Note: this only removes the Firestore profile, not the auth account. Delete the auth account from Firebase Console separately.)"))return;
  await fbDelete("users",id);
  toast("Profile deleted");
}

function cancelUser(){userForm=null;userEditId=null;render();}

Object.assign(window,{saveUser,editUser,delUser,cancelUser});

// ── Multi-device permission & session management (Admin) ──
window.toggleMultiDevice = async function(userId){
  if(!isAdmin()) return toast("Admin only");
  const u = state.users.find(x=>x.id===userId);
  if(!u) return;
  const newVal = !(u.allowMultiDevice === true);
  try{
    const {db, doc, updateDoc} = window.__fb;
    await updateDoc(doc(db,"users",userId),{ allowMultiDevice: newVal });
    toast(newVal ? `${u.name||"User"}: multiple devices allowed ✓` : `${u.name||"User"}: single device only ✓`);
  }catch(e){ toast("Error: "+e.message); }
};

window.resetUserSession = async function(userId){
  if(!isAdmin()) return toast("Admin only");
  const u = state.users.find(x=>x.id===userId);
  if(!u) return;
  if(!confirm(`Reset active session for ${u.name||"this user"}?\\n\\nThey will be signed out on their current device and can sign in again anywhere.`)) return;
  try{
    const {db, doc, updateDoc} = window.__fb;
    await updateDoc(doc(db,"users",userId),{ activeSession: "" });
    toast("Session reset ✓ — user can now sign in on any device");
  }catch(e){ toast("Error: "+e.message); }
};

async function saveNametagEmp(){
  if(!isAdmin()) return toast("Admin only");
  const name = (nametagForm.name||"").trim();
  if(!name) return toast("Name is required");
  if(name.length < 2) return toast("Name must be at least 2 characters");

  // Check duplicate against both users AND nametags
  const allNames = [
    ...state.users.map(u=>(u.employeeName||u.name||"").toLowerCase()),
    ...(state.nametagEmployees||[]).filter(e=>e.id!==nametagEditId).map(e=>(e.name||"").toLowerCase()),
  ];
  if(allNames.includes(name.toLowerCase())) return toast(`"${name}" already exists`);

  // ── CASCADE RENAME: if editing and name changed, sync across all collections ──
  let oldName = null;
  if(nametagEditId){
    const existing = (state.nametagEmployees||[]).find(e=>e.id===nametagEditId);
    if(existing && existing.name !== name) oldName = existing.name;
  }

  try {
    // If name changed, count affected records and confirm
    if(oldName){
      const affected = {
        daily:    state.daily.filter(r=>r.employee===oldName).length,
        overtime: state.overtime.filter(r=>r.employee===oldName).length,
        travel:   state.travel.filter(r=>r.employee===oldName).length,
        leaves:   state.leaves.filter(r=>r.employee===oldName).length,
      };
      const total = affected.daily + affected.overtime + affected.travel + affected.leaves;
      if(total > 0){
        const msg = `Rename "${oldName}" → "${name}"?\n\nThis will update ${total} record(s):\n` +
          `· Daily Log: ${affected.daily}\n· Overtime: ${affected.overtime}\n` +
          `· Travel: ${affected.travel}\n· Leaves: ${affected.leaves}\n\nThis cannot be undone.`;
        if(!confirm(msg)) return;
      }
    }

    // Save the nametag record first
    await fbSave("nametagEmployees", {
      id: nametagEditId || undefined,
      name,
      type: nametagForm.type || "internal",
      addedBy: state.profile.uid,
      addedAt: new Date().toISOString(),
    });

    // Cascade the rename across all data collections
    if(oldName){
      const {db, doc, updateDoc} = window.__fb;
      let synced = 0;
      const collections = [
        ["daily",    state.daily],
        ["overtime", state.overtime],
        ["travel",   state.travel],
        ["leaves",   state.leaves],
      ];
      for(const [colName, rows] of collections){
        for(const r of rows){
          if(r.employee === oldName){
            await updateDoc(doc(db, colName, r.id), { employee: name });
            synced++;
          }
        }
      }
      toast(`✓ Renamed & synced ${synced} record(s): ${oldName} → ${name}`);
    } else {
      toast(nametagEditId ? `Updated: ${name} ✓` : `Added: ${name} ✓`);
    }

    nametagForm = {name:"", type:"internal"};
    nametagEditId = null;
  } catch(e){ console.error(e); toast("Error: "+e.message); }
}

async function migrateDefaultEmployees(){
  if(!isAdmin()) return toast("Admin only");
  const existing = (state.nametagEmployees||[]).map(e=>(e.name||"").trim().toLowerCase());
  const userNames = state.users.map(u=>(u.employeeName||"").trim().toLowerCase()).filter(Boolean);
  const toMigrate = EMPLOYEES_DEFAULT.filter(n => 
    !existing.includes(n.toLowerCase()) && !userNames.includes(n.toLowerCase())
  );
  if(toMigrate.length === 0){
    return toast("All default employees are already editable ✓");
  }
  if(!confirm(`Make ${toMigrate.length} default employee(s) editable?\n\n${toMigrate.join(", ")}\n\nAfter this, you can edit their names with full data sync.`)) return;
  for(const name of toMigrate){
    await fbSave("nametagEmployees", {
      id: undefined,
      name,
      type: "internal",
      addedBy: state.profile.uid,
      addedAt: new Date().toISOString(),
      migratedFromDefault: true,
    });
  }
  toast(`✓ ${toMigrate.length} employee(s) are now editable`);
}

async function delNametagEmp(id){
  if(!isAdmin()) return toast("Admin only");
  const e = (state.nametagEmployees||[]).find(x=>x.id===id);
  if(!e) return;
  // Warn if this employee has records
  const hasRecords = [...state.daily,...state.overtime,...state.travel,...state.leaves]
    .some(r=>r.employee===e.name);
  const msg = hasRecords
    ? `Delete "${e.name}"?\n\n⚠ This employee has existing records. The records will remain but the name will no longer appear in dropdowns.`
    : `Delete "${e.name}" from the tracking list?`;

}

async function saveDept(){
  const name = (deptForm.name||"").trim();
  if(!name) return toast("Name required");
  if(!deptEditId && state.departments.find(d=>(d.name||"").trim()===name)) return toast("Department already exists");
  const id = deptEditId || name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);
  if(!id) return toast("Invalid name");

  // ── Cascade rename if name changed (Admin only) ──
  let oldName = null;
  if(deptEditId){
    const existing = state.departments.find(d=>d.id===deptEditId);
    if(existing && existing.name !== name) oldName = existing.name;
  }
  if(oldName && !isAdmin()) return toast("Only Admin can rename departments");
  if(oldName){
    const affected = state.daily.filter(r=>r.dept===oldName).length
      + state.overtime.filter(r=>r.dept===oldName).length
      + state.travel.filter(r=>r.dept===oldName).length
      + state.projects.filter(p=>p.dept===oldName).length;
    if(affected > 0 && !confirm(`Rename "${oldName}" → "${name}"?\n\nThis will update ${affected} record(s) including projects assigned to this department.\n\nThis cannot be undone.`)) return;
  }

  await fbSave("departments",{id, name, color:deptForm.color});

  if(oldName){
    const synced = await cascadeRenameDepartment(oldName, name);
    toast(`✓ Renamed & synced ${synced} record(s)`);
  } else {
    toast("Saved ✓");
  }
  deptForm = null; deptEditId = null;
}
function editDept(id){
  const d = state.departments.find(x=>x.id===id);
  if(d){ deptForm={...d}; deptEditId=id; render(); window.scrollTo(0,0); }
}
async function delDept(id){
  const d = state.departments.find(x=>x.id===id);
  if(!d) return;
  const usedBy = state.projects.filter(p=>p.dept===d.name).length;
  const msg = usedBy>0 ? `This department has ${usedBy} project(s) assigned. Delete anyway?` : "Delete this department?";
  if(confirm(msg)){
    await fbDelete("departments",id);
    toast("Deleted");
  }
}
function cancelDept(){ deptForm=null; deptEditId=null; render(); }

async function delWICategory(id){
  if(!isAdmin()) return toast("Only Admin can delete categories");
  const c = state.workCategories.find(x => x.id === id);
  if(!c) return;
  const taskCount = state.workTasks.filter(t => t.category === c.name).length;
  let msg = `Delete category "${c.name}"?`;
  if(taskCount > 0) msg += `\n\n⚠️ This will also delete ${taskCount} task(s) inside it. This cannot be undone.`;
  if(!confirm(msg)) return;
  // Delete all tasks in this category first
  for(const t of state.workTasks.filter(t => t.category === c.name)){
    await fbDelete("workTasks", t.id);
  }
  await fbDelete("workCategories", id);
  if(wiActiveCategory === c.name) wiActiveCategory = "";
  toast(`Deleted category + ${taskCount} task(s)`);
}
