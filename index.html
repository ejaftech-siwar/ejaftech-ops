<style>
:root{--navy:#1B3A6B;--navy-2:#2E5FA3;--gold:#C9A84C;--gold-2:#B58E2E;--bg:#F5F8FC;--card:#FFFFFF;--line:#D6E4F0;--text:#1A1A2E;--muted:#6B7B8F;--green:#2E7D32;--green-bg:#E8F2E8;--orange:#E65100;--orange-bg:#FCEAE0;--purple:#6A1B9A;--purple-bg:#F0E8F7;--yellow:#FFF2CC;--yellow-text:#7F6000;--red:#C0392B;--shadow:0 2px 12px rgba(27,58,107,0.08);--shadow-lg:0 8px 28px rgba(27,58,107,0.15);--radius:14px;--radius-sm:8px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:contain}
body{padding-bottom:env(safe-area-inset-bottom,0px)}

/* Login screen */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#1B3A6B 0%,#2E5FA3 100%);color:white}
.login-card{background:white;color:var(--text);border-radius:18px;padding:32px 24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-logo{width:80px;height:80px;background:var(--navy);border:3px solid var(--gold);border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:26px;color:var(--gold);font-weight:900;margin:0 auto 20px}
.login-card h2{font-family:'DM Serif Display',serif;font-size:24px;color:var(--navy);text-align:center;margin:0 0 6px}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.login-card label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;margin-top:14px}
.login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;outline:none}
.login-card input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(46,95,163,0.12)}
.login-btn{width:100%;margin-top:20px;padding:14px;background:var(--navy);color:var(--gold);border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.login-btn:disabled{opacity:0.6}
.login-err{background:#FEE;color:var(--red);padding:10px 14px;border-radius:8px;font-size:12px;margin-top:14px;border:1px solid #FCC}
.setup-needed{background:linear-gradient(135deg,#1B3A6B,#2E5FA3);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;flex-direction:column}
.setup-needed h2{font-family:'DM Serif Display',serif;color:var(--gold);font-size:26px;margin:16px 0 8px}
.setup-needed p{color:#B8CFE8;max-width:400px;line-height:1.6}
.setup-needed code{background:rgba(0,0,0,0.3);color:var(--gold);padding:2px 6px;border-radius:4px;font-size:12px}

/* Main app */
.app-header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#1B3A6B 0%,#2E5FA3 100%);color:white;padding:env(safe-area-inset-top,0px) 0 0 0;box-shadow:var(--shadow-lg)}
.header-row{display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo-mark{width:42px;height:42px;background:var(--navy);border:2px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'DM Serif Display',Georgia,serif;font-size:16px;font-weight:900;color:var(--gold)}
.app-title{flex:1;min-width:0}
.app-title h1{margin:0;font-size:15px;font-weight:700;color:white;line-height:1.1}
.app-title p{margin:2px 0 0;font-size:11px;color:#B8CFE8}
.user-chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:14px;font-size:11px;font-weight:600;background:rgba(255,255,255,0.12);color:white;cursor:pointer}
.user-chip .role-badge{background:var(--gold);color:var(--navy);padding:1px 6px;border-radius:8px;font-size:9px;font-weight:800;text-transform:uppercase}
.tab-bar{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.15)}

.tab{flex:0 0 auto;padding:12px 14px;font-size:12px;font-weight:600;color:#94B0CC;background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,0.08)}

.content{padding:14px 12px 80px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:var(--navy);margin:0 0 12px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px}
.sec-hdr{background:linear-gradient(90deg,var(--navy-2),var(--navy));color:white;margin:-16px -16px 14px;padding:10px 16px;border-radius:var(--radius) var(--radius) 0 0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px;border-left:4px solid var(--accent,var(--navy));box-shadow:var(--shadow)}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:4px}
.kpi-value{font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent,var(--navy));line-height:1;margin-bottom:2px}
.kpi-sub{font-size:10px;color:var(--muted)}

.form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form-grid.full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--card);color:var(--text);width:100%;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(46,95,163,0.12)}
.field .auto{padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13px;font-weight:700;display:flex;align-items:center;min-height:42px}
.auto.green{background:var(--green-bg);color:var(--green)}
.auto.orange{background:var(--orange-bg);color:var(--orange)}
.auto.purple{background:var(--purple-bg);color:var(--purple)}
.auto.yellow{background:var(--yellow);color:var(--yellow-text)}
.auto.empty{color:var(--muted);font-weight:400}

.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;border:none;cursor:pointer;font-family:inherit;transition:transform 0.1s}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--navy);color:var(--gold)}
.btn-secondary{background:var(--navy-2);color:white}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn-danger{background:var(--red);color:white}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.tbl-wrap{margin:0 -16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:100%}
.tbl th{background:var(--navy);color:white;padding:9px 10px;text-align:left;font-weight:700;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:nth-child(even) td{background:#F8FAFD}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px}
.badge-ent{background:var(--green-bg);color:var(--green)}
.badge-sec{background:var(--orange-bg);color:var(--orange)}
.badge-eja{background:var(--purple-bg);color:var(--purple)}
.badge-admin{background:#FFE0E0;color:var(--red)}
.badge-hr{background:#E0F0FF;color:var(--navy-2)}
.badge-emp{background:#F0F0F0;color:var(--muted)}

.empty{padding:24px 16px;text-align:center;color:var(--muted);font-style:italic;font-size:13px}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-row select{padding:7px 10px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:12px;font-family:inherit}
.count-pill{background:var(--navy);color:white;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}

.dept-block{margin-bottom:16px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.dept-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;color:white}
.dept-head.ent{background:linear-gradient(135deg,#2E7D32,#1B5E20)}
.dept-head.sec{background:linear-gradient(135deg,#E65100,#BF360C)}
.dept-head.eja{background:linear-gradient(135deg,#6A1B9A,#4A148C)}
.dept-head h3{margin:0;font-size:13px;font-weight:800;text-transform:uppercase}
.dept-head .total{font-family:'DM Serif Display',serif;font-size:22px}
.dept-body{padding:12px 14px;background:white}
.dept-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.dept-row:last-child{border-bottom:none}
.dept-row .name{font-weight:600;color:var(--navy)}
.dept-row .hrs{font-weight:700;font-variant-numeric:tabular-nums}
.dept-row .pct{font-size:11px;color:var(--muted);font-weight:600;min-width:44px;text-align:right}
.dept-row .bar-container{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.dept-row .bar-fill{height:100%;transition:width 0.4s}
.dept-row.ent .bar-fill{background:var(--green)}
.dept-row.sec .bar-fill{background:var(--orange)}
.dept-row.eja .bar-fill{background:var(--purple)}

.donut-container{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0}
.donut-svg{width:200px;height:200px}
.donut-legend{width:100%;display:grid;gap:6px}
.donut-leg-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#F8FAFD;border-radius:var(--radius-sm);font-size:12px}
.donut-leg-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.donut-leg-name{flex:1;font-weight:600;color:var(--navy)}
.donut-leg-val{font-weight:700;font-variant-numeric:tabular-nums}
.donut-leg-pct{font-size:11px;color:var(--muted);font-weight:600;min-width:40px;text-align:right}

.proj-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.proj-chip{background:#F8FAFD;border:1px solid var(--line);padding:4px 10px;border-radius:14px;font-size:11px;color:var(--navy);display:flex;align-items:center;gap:6px}

.user-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:white}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-info .name{font-weight:700;color:var(--navy);font-size:13px}
.user-info .email{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}

.loader{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F8FC}
.loader-spin{width:48px;height:48px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  CONSTANTS & STATE
// ═══════════════════════════════════════════════════════════════════════
const EMPLOYEES_DEFAULT = ["Siwar Sheikho","Nawar Raffo","Luay Alrasheed","Elias","Abdullah"];
const EMP_COLORS = ["#1B5E9B","#C9A84C","#2E7D32","#E65100","#6A1B9A","#3949AB","#00897B","#D81B60"];

const DEFAULT_PROJECTS = [
  ["Asia cell","Enterprise"],["Garmian petroleum","Security"],["Inmaa","Enterprise"],
  ["newrozFM200","Security"],["Down town","Enterprise"],["Yana","Security"],
  ["AUK-FM200","Security"],["Alsafi danon","Security"],["MST-Baghdad","Security"],
  ["Alraaedi-FM200","Security"],["Iratrac","Security"],["Justice tower","Enterprise"],
  ["Northholand towers","Security"],["Masarat","Enterprise"],["Greyhound Erbil","Security"],
  ["London Tower","Security"],["Americana","Security"],["Fast Iraq","Enterprise"],
  ["Asia cell Mosul","Enterprise"],["Alwazir","Security"],
  ["HR & Admin Tasks","Ejaf"],["Legal & Compliance","Ejaf"],["Finance & Accounting","Ejaf"],
  ["IT & Infrastructure","Ejaf"],["Company Meetings","Ejaf"],["Training & Development","Ejaf"],
  ["Procurement","Ejaf"],["General Affairs","Ejaf"],
].map(([name,dept])=>({id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name,dept}));

const DEFAULT_LOCATIONS = ["Erbil","Sulaymaniyah","Duhok","Kallar","Zakho","Baghdad","Basra"]
  .map(name=>({id:name.toLowerCase(),name}));

const PER_DIEM_RATE = 40000;

const state = {
  user: null,           // Firebase auth user
  profile: null,        // {role, name, email, employeeName, ...} from users collection
  daily: [], overtime: [], travel: [], leaves: [], projects: [], locations: [], users: [], departments: [],
  tab: "Dashboard",
  initialized: false,
  unsubs: [],           // active Firestore listeners
  reportFilter: { from: "", to: "" },  // for flexible reports
};

// Forms
let dailyForm=null, dailyEditId=null, dailyFilter="", dailyLocFilter="";
let otForm=null, otEditId=null;
let trForm=null, trEditId=null;
let projForm=null, projEditId=null;
let locForm="", locEditId=null;
let userForm=null, userEditId=null;

// ═══════════════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════════════
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().split("T")[0];
const fmtDate=(d)=>d?new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"}):"—";
const fmtMoney=(n)=>n==null||n===""?"—":Math.round(Number(n)||0).toLocaleString();
const fmtHM=(hrs)=>{
  if(!hrs||isNaN(hrs))return "0:00";
  const h=Math.floor(hrs),m=Math.round((hrs-h)*60);
  return m===60?`${h+1}:00`:`${h}:${m.toString().padStart(2,"0")}`;
};
const timeToHrs=(s,e)=>{
  if(!s||!e)return 0;
  const[sh,sm]=s.split(":").map(Number),[eh,em]=e.split(":").map(Number);
  return Math.max(0,(eh*60+em-sh*60-sm)/60);
};
const dayName=(d)=>d?["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(d).getDay()]:"";
const projDept=(p)=>{const tp=(p||"").trim();return state.projects.find(x=>(x.name||"").trim()===tp)?.dept||"";};
const deptBadge=(d)=>{if(!d)return "";const c=d==="Enterprise"?"ent":d==="Security"?"sec":"eja";return `<span class="badge badge-${c}">${d}</span>`;};
const escapeHtml=(s)=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

let toastTimer;
function toast(msg){
  const t=$("toast");
  if(!t)return;
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2800);
}

// Role helpers — case-insensitive and robust against trailing spaces.
// Default behavior: if role is unset/invalid, treat user as EMPLOYEE (most restrictive).
function getUserRole(){
  const r = (state.profile?.role || "").toString().toLowerCase().trim();
  if(r === "admin") return "admin";
  if(r === "hr" || r === "manager") return "hr";
  return "employee";  // safe default
}
function isAdmin(){return getUserRole()==="admin";}
function isHR(){const r=getUserRole();return r==="admin"||r==="hr";}
function isEmployee(){return getUserRole()==="employee";}

// Filter rows by role
function visibleRows(rows){
  if(isHR()) return rows;
  return rows.filter(r=>r.employee===state.profile?.employeeName);
}

// Get list of employees (from users + defaults)
// Only includes users explicitly marked as tracked employees (isTrackedEmployee=true)
// or users whose role is "employee" (default behavior for backward compatibility)
function allEmployees(){
  const fromUsers = state.users
    .filter(u => {
      if(!u.employeeName) return false;
      // Explicit flag takes priority
      if(u.isTrackedEmployee === true) return true;
      if(u.isTrackedEmployee === false) return false;
      // Backward compatibility: include only "employee" role by default
      // HR and admin are EXCLUDED unless explicitly marked
      // Case-insensitive role comparison for safety
      const role = (u.role || "").toString().toLowerCase().trim();
      return role === "employee";
    })
    .map(u => (u.employeeName || "").trim())
    .filter(Boolean);
  const merged = Array.from(new Set([...EMPLOYEES_DEFAULT, ...fromUsers]));
  return merged;
}

async function loadProfile(){
  try{
    const{db,doc,getDoc}=window.__fb;
    const snap=await getDoc(doc(db,"users",state.user.uid));
    if(snap.exists()){
      state.profile={uid:state.user.uid,...snap.data()};
    } else {
      state.profile=null;
    }
  } catch(e){
    console.error("Load profile error:",e);
    state.profile=null;
  }
}

function cleanupSubs(){
  state.unsubs.forEach(u=>{try{u();}catch(e){}});
  state.unsubs=[];
}

async function subscribeData(){
  cleanupSubs();
  const{db,collection,onSnapshot}=window.__fb;
  state.initialized=false;
  renderRoot(`<div class="loader"><div class="loader-spin"></div></div>`);

  const subs=[
    ["daily","daily"],["overtime","overtime"],["travel","travel"],["leaves","leaves"],
    ["projects","projects"],["locations","locations"],["users","users"],
    ["departments","departments"],
  ];
  let firstCount=0;

  subs.forEach(([col,key])=>{
    const unsub=onSnapshot(collection(db,col),async(snap)=>{
      const items=[];
      snap.forEach(d=>items.push({id:d.id,...d.data()}));
      if(["daily","overtime","travel"].includes(col)){
        items.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      } else if(col==="users"){
        items.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      } else {
        items.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      }
      state[key]=items;

      // Seed defaults on first run (admin only, if projects empty)
      if(col==="projects" && items.length===0 && isAdmin() && !state._seeded){
        state._seeded=true;
        await seedDefaults();
      }

      firstCount++;
      if(firstCount>=8 && !state.initialized){
        state.initialized=true;
        renderApp();
      } else if(state.initialized){
        renderTab();
      }
    },(err)=>{
      console.error(`${col} sync error:`,err);
      toast(`Sync error: ${col}`);
    });
    state.unsubs.push(unsub);
  });
}

  const{db,doc,setDoc}=window.__fb;
  try{

      {id:"enterprise", name:"Enterprise", color:"#2E7D32"},
      {id:"security", name:"Security", color:"#E65100"},
      {id:"ejaf", name:"Ejaf", color:"#6A1B9A"},
    ];
    for(const d of DEFAULT_DEPTS){
      await setDoc(doc(db,"departments",d.id),{name:d.name,color:d.color});
    }
    for(const p of DEFAULT_PROJECTS){
      await setDoc(doc(db,"projects",p.id),{name:p.name,dept:p.dept});
    }
    for(const l of DEFAULT_LOCATIONS){
      await setDoc(doc(db,"locations",l.id),{name:l.name});

async function doSignIn(email,password){
  try{
    const{auth,signInWithEmailAndPassword}=window.__fb;
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    let msg="Sign in failed";
    if(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/user-not-found")msg="Invalid email or password";
    if(e.code==="auth/invalid-email")msg="Invalid email format";
    if(e.code==="auth/network-request-failed")msg="Network error — check connection";
    return msg;
  }
  return null;
}

async function doSignOut(){
  try{
    const{auth,signOut}=window.__fb;
    cleanupSubs();
    await signOut(auth);
  }catch(e){console.error(e);}
}

  if(v && v.trim()) localStorage.setItem("opt_period", v.trim());

}

function csvEscape(v){
  if(v==null) return "";
  const s=String(v);
  if(s.includes(",")||s.includes("\"")||s.includes("\n")) return `"${s.replace(/"/g,'""')}"`;
  return s;
}

function downloadFile(filename, content, mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}

function summary(){
  const emps=isEmployee()?[state.profile.employeeName]:allEmployees();
  const depts = deptNames();
  return emps.filter(Boolean).map(emp=>{
    const d=state.daily.filter(r=>r.employee===emp);
    const o=state.overtime.filter(r=>r.employee===emp);
    const t=state.travel.filter(r=>r.employee===emp);
    const lv=state.leaves.filter(r=>r.employee===emp);
    // Build per-department hours object dynamically
    const byDept = {};
    let total = 0;
    depts.forEach(dn => {
      const h = d.filter(r=>r.dept===dn).reduce((s,r)=>s+Number(r.duration||0),0);
      byDept[dn] = h;
      total += h;
    });
    // legacy fields for backwards compatibility
    const ent = byDept["Enterprise"] || 0;
    const sec = byDept["Security"] || 0;
    const eja = byDept["Ejaf"] || 0;
    const ot=o.reduce((s,r)=>s+Number(r.hours||0),0);
    const tDays=t.reduce((s,r)=>s+Number(r.days||0),0);
    const pd=t.reduce((s,r)=>s+Number(r.perDiem||0),0);
    // Leave breakdown — robust calculation handling all kinds
    // Priority: 1) saved days field, 2) saved hours/9, 3) compute from kind
    const leaveDays = lv.reduce((sum, r) => {
      // If days field exists and is valid, use it
      if(r.days !== undefined && r.days !== null && !isNaN(Number(r.days))){
        return sum + Number(r.days);
      }
      // Else if hours field exists, convert
      if(r.hours !== undefined && r.hours !== null && !isNaN(Number(r.hours))){
        return sum + (Number(r.hours) / WORK_HOURS_PER_DAY);
      }
      // Else compute from leave structure
      const amt = computeLeaveAmount(r);
      return sum + amt.days;
    }, 0);
    const leaveBreakdown = {};
    LEAVE_TYPES.forEach(lt => {
      const items = lv.filter(r=>r.type===lt.id);
      leaveBreakdown[lt.id] = items.reduce((sum, r) => {
        if(r.days !== undefined && r.days !== null && !isNaN(Number(r.days))) return sum + Number(r.days);
        if(r.hours !== undefined && r.hours !== null && !isNaN(Number(r.hours))) return sum + (Number(r.hours) / WORK_HOURS_PER_DAY);
        return sum + computeLeaveAmount(r).days;
      }, 0);
    });
    return{emp,byDept,ent,sec,eja,total,ot,tDays,pd,sessions:d.length,leaveDays,leaveBreakdown};
  });
}

function donutSVG(slices,total){
  if(total===0){
    return `<svg class="donut-svg" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="80" fill="none" stroke="#E0E8F0" stroke-width="32"/>
      <text x="100" y="105" text-anchor="middle" font-family="DM Serif Display" font-size="22" fill="#6B7B8F">No Data</text></svg>`;
  }
  const r=80,cx=100,cy=100;
  let cum=-Math.PI/2;
  const segs=slices.filter(s=>s.value>0).map(s=>{
    const a=(s.value/total)*Math.PI*2;
    const x1=cx+r*Math.cos(cum),y1=cy+r*Math.sin(cum);
    cum+=a;
    const x2=cx+r*Math.cos(cum),y2=cy+r*Math.sin(cum);
    const large=a>Math.PI?1:0;
    return `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${s.color}" stroke="white" stroke-width="2"/>`;
  }).join("");
  return `<svg class="donut-svg" viewBox="0 0 200 200">${segs}
    <circle cx="${cx}" cy="${cy}" r="48" fill="white"/>
    <text x="100" y="95" text-anchor="middle" font-family="DM Serif Display" font-size="20" fill="#1B3A6B" font-weight="700">${fmtHM(total)}</text>
    <text x="100" y="115" text-anchor="middle" font-family="Inter" font-size="10" fill="#6B7B8F" letter-spacing="1">TOTAL HOURS</text></svg>`;
}

//  LEAVES MODULE (vacations, sick days, etc.)
// ═══════════════════════════════════════════════════════════════════════
let leaveForm = null, leaveEditId = null, leaveFilter = "";

const LEAVE_TYPES = [
  {id:"annual", label:"Annual Leave", color:"#2E7D32"},
  {id:"sick", label:"Sick Leave", color:"#C62828"},
  {id:"unpaid", label:"Unpaid Leave", color:"#6B7B8F"},
  {id:"emergency", label:"Emergency", color:"#E65100"},
  {id:"maternity", label:"Maternity/Paternity", color:"#6A1B9A"},
  {id:"other", label:"Other", color:"#1565C0"},
];

// Work day configuration (used for sub-day leave conversions)
const WORK_HOURS_PER_DAY = 9;       // 8:30 → 17:30 = 9 hours
const HALF_DAY_FIRST_START = "08:30";
const HALF_DAY_FIRST_END   = "13:00";
const HALF_DAY_SECOND_START= "13:00";
const HALF_DAY_SECOND_END  = "17:30";
const HALF_DAY_HOURS = 4.5;          // each half = 4.5 hours

function leaveTypeInfo(id){
  return LEAVE_TYPES.find(t=>t.id===id) || LEAVE_TYPES[LEAVE_TYPES.length-1];
}

function leaveTypeBadge(type){
  const t = leaveTypeInfo(type);
  return `<span style="background:${t.color}22;color:${t.color};padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px">${t.label}</span>`;
}

function daysBetween(from, to){
  if(!from || !to) return 0;
  const d1 = new Date(from), d2 = new Date(to);
  const diff = Math.round((d2 - d1) / (1000*60*60*24)) + 1;
  return Math.max(0, diff);
}

// Compute total hours for a leave entry based on its kind
// Returns { hours, days } where days = hours / WORK_HOURS_PER_DAY
function computeLeaveAmount(leave){
  const kind = leave.kind || "full";
  if(kind === "full"){
    const days = daysBetween(leave.from, leave.to);
    return { hours: days * WORK_HOURS_PER_DAY, days: days, label: `${days} day${days===1?'':'s'}` };
  }
  if(kind === "half"){
    const halfLabel = leave.halfPart === "second" ? "Second Half (13:00-17:30)" : "First Half (08:30-13:00)";
    return { hours: HALF_DAY_HOURS, days: HALF_DAY_HOURS / WORK_HOURS_PER_DAY, label: halfLabel };
  }
  if(kind === "hourly"){
    const h = timeToHrs(leave.startTime, leave.endTime);
    return { hours: h, days: h / WORK_HOURS_PER_DAY, label: `${leave.startTime || '?'} → ${leave.endTime || '?'} (${fmtHM(h)})` };
  }
  return { hours: 0, days: 0, label: "" };
}

function leaveKindBadge(kind){
  const map = {
    full:    { label: "Full Day",  color: "#2E7D32" },
    half:    { label: "Half Day",  color: "#E65100" },
    hourly:  { label: "Hourly",    color: "#1565C0" },
  };
  const m = map[kind || "full"];
  return `<span style="background:${m.color}22;color:${m.color};padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px">${m.label}</span>`;
}

      <div class="field"><label>Employee <span class="req">*</span></label>
        ${isEmployee()
          ? `<select onchange="window.leaveForm.employee=this.value;render()"><option value="${escapeHtml(state.profile.employeeName||"")}" selected>${escapeHtml(state.profile.employeeName||"")}</option></select>`

      ${isAnnual ? `<div class="field full" style="background:#FFF8E1;border:1px solid #FFE082;border-radius:8px;padding:10px">

async function saveLeave(){
  if(!leaveForm.employee)return toast("Employee required");
  // Strict employee guard: force own name on save
  if(isEmployee()){
    if(!state.profile.employeeName) return toast("Your account has no employee profile. Contact admin.");
    leaveForm.employee = state.profile.employeeName;
  }
  const kind = leaveForm.kind || "full";
  if(kind === "full"){
    if(!leaveForm.from || !leaveForm.to) return toast("From and To dates required");
    if(leaveForm.from > leaveForm.to) return toast("From date must be before To date");
  } else if(kind === "half"){
    if(!leaveForm.from) return toast("Date required");
    leaveForm.to = leaveForm.from;
    if(!leaveForm.halfPart) leaveForm.halfPart = "first";
  } else if(kind === "hourly"){
    if(!leaveForm.from) return toast("Date required");
    if(!leaveForm.startTime || !leaveForm.endTime) return toast("Start and End times required");
    if(leaveForm.startTime >= leaveForm.endTime) return toast("End must be after Start");
    leaveForm.to = leaveForm.from;
  }
  const amount = computeLeaveAmount(leaveForm);
  await fbSave("leaves", {
    id: leaveEditId || undefined,
    ...leaveForm,
    hours: amount.hours,
    days: amount.days,
    createdBy: state.profile.uid,
  });
  leaveForm = null; leaveEditId = null;
  toast(leaveEditId ? "Updated ✓" : "Added ✓");
}
async function saveLeaveAndNext(){
  if(!leaveForm.employee)return toast("Employee required");
  if(isEmployee()) return toast("Use Save for single entry");
  const kind = leaveForm.kind || "full";
  if(kind === "full"){
    if(!leaveForm.from || !leaveForm.to) return toast("From and To dates required");
    if(leaveForm.from > leaveForm.to) return toast("From date must be before To date");
  } else if(kind === "half"){
    if(!leaveForm.from) return toast("Date required");
    leaveForm.to = leaveForm.from;
  } else if(kind === "hourly"){
    if(!leaveForm.from) return toast("Date required");
    if(!leaveForm.startTime || !leaveForm.endTime) return toast("Start and End times required");
    if(leaveForm.startTime >= leaveForm.endTime) return toast("End must be after Start");
    leaveForm.to = leaveForm.from;
  }
  const amount = computeLeaveAmount(leaveForm);
  await fbSave("leaves", {
    id: undefined,
    ...leaveForm,
    hours: amount.hours,
    days: amount.days,
    createdBy: state.profile.uid,
  });
  const savedEmp = leaveForm.employee;
  leaveForm = {...leaveForm, employee:""};
  toast(`Saved for ${savedEmp} ✓ — Select next employee`);
}
function editLeave(id){
  const r = state.leaves.find(x=>x.id===id);
  if(r){
    // Ensure backward compatibility - older entries won't have kind/hours
    const leave = {...r, kind: r.kind || "full"};
    if(!leave.startTime) leave.startTime = "10:00";
    if(!leave.endTime) leave.endTime = "12:00";
    if(!leave.halfPart) leave.halfPart = "first";
    leaveForm = leave;
    leaveEditId = id;
    render();
    window.scrollTo(0,0);
  }
}
async function delLeave(id){
  if(confirm("Delete this leave entry?")){ await fbDelete("leaves", id); toast("Deleted"); }
}
function cancelLeave(){ leaveForm = null; leaveEditId = null; render(); }
Object.assign(window, {saveLeave, saveLeaveAndNext, editLeave, delLeave, cancelLeave});
Object.defineProperty(window, 'leaveForm', {get:()=>leaveForm, set:v=>leaveForm=v, configurable:true});

async function saveUser(){
  if(!userForm.name.trim()||!userForm.email.trim())return toast("Name and email required");

  // Build user data with proper isTrackedEmployee handling
  const role = userForm.role;
  const isEmp = role === "employee";
  // For HR/admin: only include employeeName if explicitly tracked
  const trackedName = isEmp ? (userForm.employeeName||userForm.name) : (userForm.isTrackedEmployee ? userForm.employeeName : "");
  const userData = {
    name:userForm.name,
    email:userForm.email,
    role:role,
    employeeName: trackedName,
    isTrackedEmployee: isEmp ? true : !!userForm.isTrackedEmployee,
  };

  if(userEditId){
    // Update existing user profile (not auth account)
    try{
      const{db,doc,setDoc}=window.__fb;
      await setDoc(doc(db,"users",userEditId), userData, {merge:true});
      userForm=null;userEditId=null;toast("Updated ✓");
    }catch(e){console.error(e);toast("Update failed");}
    return;
  }

  // Create new auth user + Firestore profile
  if(!userForm.password||userForm.password.length<6)return toast("Password must be 6+ chars");
  if(!userForm.adminPassword||userForm.adminPassword.length<6)return toast("Enter YOUR (admin) password to confirm");

  try{
    const{auth,createUserWithEmailAndPassword,signInWithEmailAndPassword,db,doc,setDoc}=window.__fb;
    const adminEmail = state.profile.email;
    const adminPassword = userForm.adminPassword;

    // Step 1: Create the new auth user (auto-signs us in as the new user)
    const cred = await createUserWithEmailAndPassword(auth, userForm.email, userForm.password);
    const newUid = cred.user.uid;

    // Step 2: Sign back in as admin (required so Firestore Rules accept the write)
    await signInWithEmailAndPassword(auth, adminEmail, adminPassword);

    // Step 3: Now write the user profile as admin
    await setDoc(doc(db,"users",newUid), userData);

    toast(`✓ User created successfully`);
    userForm=null;
  }catch(e){
    console.error(e);
    let msg="Create failed";
    if(e.code==="auth/email-already-in-use")msg="Email already registered";
    if(e.code==="auth/weak-password")msg="Password too weak (need 6+ chars)";
    if(e.code==="auth/wrong-password"||e.code==="auth/invalid-credential")msg="Wrong admin password";
    toast(msg);
  }
}

function editUser(id){
  const u=state.users.find(x=>x.id===id);
  if(u){userForm={name:u.name||"",email:u.email||"",password:"",role:u.role||"employee",employeeName:u.employeeName||""};userEditId=id;render();window.scrollTo(0,0);}
}

async function delUser(id){
  if(!confirm("Delete this user profile? (Note: this only removes the Firestore profile, not the auth account. Delete the auth account from Firebase Console separately.)"))return;
  await fbDelete("users",id);
  toast("Profile deleted");
}

function cancelUser(){userForm=null;userEditId=null;render();}

Object.assign(window,{saveUser,editUser,delUser,cancelUser});

function getDept(name){
  if(!name) return null;
  return state.departments.find(d=>d.name===name) || null;
}
function deptColor(name){
  const d = getDept(name);
  return d ? d.color : "#6B7B8F";
}
function deptBg(name){
  const c = deptColor(name);
  // Convert hex to rgba with 0.12 opacity
  const hex = c.replace('#','');
  const r = parseInt(hex.substr(0,2),16);
  const g = parseInt(hex.substr(2,2),16);
  const b = parseInt(hex.substr(4,2),16);
  return `rgba(${r},${g},${b},0.12)`;
}
function deptBadgeDyn(name){
  if(!name) return "";
  const color = deptColor(name);
  return `<span style="background:${deptBg(name)};color:${color};padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px">${escapeHtml(name)}</span>`;
}

  return state.departments.map(d=>d.name);
}

// ═══════════════════════════════════════════════════════════════════════
function exportBackup(){
  try{
    const backup = {
      version: "1.1",
      exportedAt: new Date().toISOString(),
      exportedBy: state.profile.email,
      projectId: "ejaftech-hr",
      data: {
        users: state.users,
        departments: state.departments,
        projects: state.projects,
        locations: state.locations,
        daily: state.daily,
        overtime: state.overtime,
        travel: state.travel,
        leaves: state.leaves,
      },
      counts: {
        users: state.users.length,
        departments: state.departments.length,
        projects: state.projects.length,
        locations: state.locations.length,
        daily: state.daily.length,
        overtime: state.overtime.length,
        travel: state.travel.length,
        leaves: state.leaves.length,
      }
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const dateStr = new Date().toISOString().split('T')[0];
    a.download = `EjafTech_Backup_${dateStr}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded ✓ Save it safely!');
  }catch(e){
    console.error(e);
    toast('Backup failed: ' + e.message);
  }
}

async function importBackup(file){
  if(!file) return;
  if(!isAdmin()) return toast('Only admin can restore backups');
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup.data) return toast('Invalid backup file');

    const total = (backup.counts.daily||0) + (backup.counts.overtime||0) + (backup.counts.travel||0) + (backup.counts.leaves||0);
    if(!confirm(`Restore backup from ${backup.exportedAt}?\n\nThis will ADD ${total} records to your current data.\n\nContinue?`)) return;

    const {db, doc, setDoc} = window.__fb;
    let restored = 0;

    // Restore each collection (including leaves)
    const cols = ['departments','projects','locations','daily','overtime','travel','leaves'];
    for(const col of cols){
      const items = backup.data[col] || [];
      for(const item of items){
        const {id, ...data} = item;
        if(id) {
          await setDoc(doc(db, col, id), data);
          restored++;
        }
      }
    }
    toast(`Restored ${restored} records ✓`);
  }catch(e){
    console.error(e);
    toast('Restore failed: ' + e.message);
  }
}
window.exportBackup = exportBackup;
window.importBackup = importBackup;

function passwordStrengthBar(pw){
  let score = 0;
  if(pw.length >= 6) score++;
  if(pw.length >= 10) score++;
  if(/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  const colors = ['#C62828','#E65100','#F9A825','#558B2F','#2E7D32'];
  const labels = ['Very Weak','Weak','Fair','Good','Strong'];
  const idx = Math.min(score, 4);
  const pct = (score/5)*100;
  return `<div style="margin-top:4px">
    <div style="height:6px;background:#F0F0F0;border-radius:3px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${colors[idx]};transition:width 0.3s"></div>
    </div>
    <div style="font-size:11px;color:${colors[idx]};font-weight:700;margin-top:4px">Password strength: ${labels[idx]}</div>
  </div>`;
}

async function changeMyPassword(){
  if(!profileForm.current || !profileForm.newPass) return toast("All fields required");
  if(profileForm.newPass.length < 6) return toast("Password must be 6+ characters");
  if(profileForm.newPass !== profileForm.confirm) return toast("Passwords don't match");
  if(profileForm.newPass === profileForm.current) return toast("New password must be different");

  try {
    const { auth, EmailAuthProvider, reauthenticateWithCredential, updatePassword } = window.__fb;
    const user = auth.currentUser;
    if(!user) return toast("Not signed in");

    // Re-authenticate with current password
    const credential = EmailAuthProvider.credential(user.email, profileForm.current);
    await reauthenticateWithCredential(user, credential);

    // Update to new password
    await updatePassword(user, profileForm.newPass);

    toast("✓ Password updated successfully!");
    profileForm = { current:"", newPass:"", confirm:"", showOldPass:false, showNewPass:false };
    render();
  } catch(e) {
    console.error(e);
    let msg = "Failed to change password";
    if(e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Current password is incorrect";
    if(e.code === "auth/weak-password") msg = "New password is too weak";
    if(e.code === "auth/requires-recent-login") msg = "Please sign out and sign in again, then try";
    if(e.code === "auth/too-many-requests") msg = "Too many attempts. Try again later.";
    toast("❌ " + msg);
  }
}

function renderFlexReports(){
  const f = state.reportFilter;
  // Default: current month if empty
  if(!f.from && !f.to){
    const today = new Date();
    const first = new Date(today.getFullYear(), today.getMonth(), 1);
    f.from = first.toISOString().split("T")[0];
    f.to = today.toISOString().split("T")[0];
  }

  // Filter rows by date range
  const inRange = (r) => {
    if(!r.date) return false;
    if(f.from && r.date < f.from) return false;
    if(f.to && r.date > f.to) return false;
    return true;
  };
  // Leaves use 'from' field as date
  const leaveInRange = (l) => {
    if(!l.from) return false;
    if(f.from && l.from < f.from) return false;
    if(f.to && l.from > f.to) return false;
    return true;
  };

  const allowedEmps = isEmployee() ? [state.profile.employeeName] : allEmployees();
  const dailyFiltered = state.daily.filter(r=>inRange(r) && allowedEmps.includes(r.employee));
  const otFiltered = state.overtime.filter(r=>inRange(r) && allowedEmps.includes(r.employee));
  const trFiltered = state.travel.filter(r=>inRange(r) && allowedEmps.includes(r.employee));
  const lvFiltered = state.leaves.filter(r=>leaveInRange(r) && allowedEmps.includes(r.employee));

  // Stats per department
  const deptStats = state.departments.map(d=>{
    const dHours = dailyFiltered.filter(r=>r.dept===d.name).reduce((s,r)=>s+Number(r.duration||0),0);
    const dCount = dailyFiltered.filter(r=>r.dept===d.name).length;
    const otHours = otFiltered.filter(r=>r.dept===d.name).reduce((s,r)=>s+Number(r.hours||0),0);
    return {...d, hours: dHours, count: dCount, otHours};
  });
  const totalHours = deptStats.reduce((s,d)=>s+d.hours,0);

  // Stats per employee
  const empStats = allowedEmps.map(emp=>{
    const eDaily = dailyFiltered.filter(r=>r.employee===emp);
    const eOT = otFiltered.filter(r=>r.employee===emp);
    const eTr = trFiltered.filter(r=>r.employee===emp);
    const eLv = lvFiltered.filter(r=>r.employee===emp);
    return {
      emp,
      hours: eDaily.reduce((s,r)=>s+Number(r.duration||0),0),
      sessions: eDaily.length,
      ot: eOT.reduce((s,r)=>s+Number(r.hours||0),0),
      travelDays: eTr.reduce((s,r)=>s+Number(r.days||0),0),
      perDiem: eTr.reduce((s,r)=>s+Number(r.perDiem||0),0),
      leaveDays: eLv.reduce((sum, r) => {
        if(r.days !== undefined && r.days !== null && !isNaN(Number(r.days))) return sum + Number(r.days);
        if(r.hours !== undefined && r.hours !== null && !isNaN(Number(r.hours))) return sum + (Number(r.hours) / WORK_HOURS_PER_DAY);
        return sum + computeLeaveAmount(r).days;
      }, 0),
    };
  });

  const presets = [
    {label:"This Month"},
    {label:"Last Month"},
    {label:"Last 3 Months"},
    {label:"Last 6 Months"},
    {label:"This Year"},
  ];

  const td=new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
  const totH=empStats.reduce((s,e)=>s+e.hours,0);
  const totOT=empStats.reduce((s,e)=>s+e.ot,0);
  const totTr=empStats.reduce((s,e)=>s+e.travelDays,0);
  const totPD=empStats.reduce((s,e)=>s+e.perDiem,0);
  const totLv=empStats.reduce((s,e)=>s+e.leaveDays,0);

  // ═══════ HEADER (Unified Brand Style) ═══════
  let h=`<div class="card" style="background:linear-gradient(135deg,#1B3A6B 0%,#2E5FA3 100%);color:white;border:2px solid #C9A84C;position:relative;overflow:hidden">
    <div style="position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle,#C9A84C22,transparent);border-radius:50%"></div>
    <div style="display:flex;align-items:center;gap:14px;position:relative">
      <div style="width:56px;height:56px;border:2px solid #C9A84C;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#1B3A6B">
        <span style="font-family:'DM Serif Display',serif;font-size:18px;color:#C9A84C;font-weight:700">EJAF</span>
      </div>
      <div style="flex:1;min-width:0">
        <h2 style="font-family:'DM Serif Display',serif;font-size:22px;color:white;margin:0;line-height:1.2">Flexible Period Reports</h2>
        <div style="font-size:11px;color:#C9A84C;margin-top:4px;text-transform:uppercase;letter-spacing:1px">Operation Department Track</div>
        <div style="font-size:11px;color:#B8CFE8;margin-top:6px">Range: <strong>${f.from||'start'}</strong> → <strong>${f.to||'today'}</strong> · Issued: ${td}</div>
        <div style="font-size:10px;color:#8AA8C8;margin-top:2px;font-style:italic">By: ${escapeHtml(state.profile.name||state.profile.email)}</div>
      </div>
    </div>
  </div>`;

  // ═══════ FILTER CONTROLS (Section 01) ═══════
  h+=`<div class="card">
    <div class="sec-hdr" style="display:flex;align-items:center;gap:8px"><span style="background:#C9A84C;color:#1B3A6B;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:800">01</span> Filter Period</div>
    <div class="form-grid">
      <div class="field"><label>From Date</label>
        <input type="date" value="${f.from}" onchange="window.setReportFrom(this.value)"></div>
      <div class="field"><label>To Date</label>
        <input type="date" value="${f.to}" onchange="window.setReportTo(this.value)"></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
      ${presets.map((p,i)=>`<button class="btn btn-sm btn-ghost" onclick="window.applyPreset(${i})">${p.label}</button>`).join("")}
    </div>
  </div>`;

  // ═══════ EXECUTIVE KPI SUMMARY (Section 02) ═══════
  h+=`<div class="card">
    <div class="sec-hdr" style="display:flex;align-items:center;gap:8px"><span style="background:#C9A84C;color:#1B3A6B;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:800">02</span> Executive Summary</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px">
      <div style="border:1px solid var(--line);border-left:4px solid #2E5FA3;border-radius:8px;padding:12px;background:white">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:1px">Total Hours</div>
        <div style="font-family:'DM Serif Display',serif;font-size:22px;color:#2E5FA3;margin-top:2px">${fmtHM(totH)}</div>
        <div style="font-size:10px;color:var(--muted)">${dailyFiltered.length} sessions</div>
      </div>
      <div style="border:1px solid var(--line);border-left:4px solid #E65100;border-radius:8px;padding:12px;background:white">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:1px">Overtime</div>
        <div style="font-family:'DM Serif Display',serif;font-size:22px;color:#E65100;margin-top:2px">${fmtHM(totOT)}</div>
        <div style="font-size:10px;color:var(--muted)">${otFiltered.length} entries</div>
      </div>
      <div style="border:1px solid var(--line);border-left:4px solid #2E7D32;border-radius:8px;padding:12px;background:white">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:1px">Travel Days</div>
        <div style="font-family:'DM Serif Display',serif;font-size:22px;color:#2E7D32;margin-top:2px">${totTr}</div>
        <div style="font-size:10px;color:var(--muted)">${trFiltered.length} trips</div>
      </div>
      <div style="border:1px solid var(--line);border-left:4px solid #6A1B9A;border-radius:8px;padding:12px;background:white">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:1px">Per Diem</div>
        <div style="font-family:'DM Serif Display',serif;font-size:22px;color:#6A1B9A;margin-top:2px">${fmtMoney(totPD)}</div>
        <div style="font-size:10px;color:var(--muted)">IQD total</div>
      </div>
      <div style="border:1px solid var(--line);border-left:4px solid #C62828;border-radius:8px;padding:12px;background:white">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:1px">Leave Days</div>
        <div style="font-family:'DM Serif Display',serif;font-size:22px;color:#C62828;margin-top:2px">${totLv}</div>
        <div style="font-size:10px;color:var(--muted)">${lvFiltered.length} entries</div>
      </div>
    </div>
  </div>`;

  // ═══════ DEPARTMENT PERFORMANCE (Section 03) ═══════
  h+=`<div class="card">
    <div class="sec-hdr" style="display:flex;align-items:center;gap:8px"><span style="background:#C9A84C;color:#1B3A6B;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:800">03</span> Department Performance</div>
    ${deptStats.length===0?`<div class="empty">No departments defined yet</div>`:`
    <div style="display:grid;gap:10px;margin-top:10px">
      ${deptStats.map(d=>{
        const pct = totalHours>0 ? (d.hours/totalHours*100) : 0;
        return `<div style="border:1px solid var(--line);border-left:5px solid ${d.color};border-radius:10px;padding:12px 14px;background:white">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
            <strong style="color:${d.color};font-size:14px">${escapeHtml(d.name)}</strong>
            <span style="font-family:'DM Serif Display',serif;font-size:18px;color:${d.color}">${fmtHM(d.hours)}</span>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${d.count} entries · ${fmtHM(d.otHours)} OT · ${pct.toFixed(1)}% of total</div>
          <div style="height:6px;background:#F0F0F0;border-radius:3px;overflow:hidden"><div style="height:100%;background:${d.color};width:${pct}%;transition:width 0.4s"></div></div>
        </div>`;
      }).join("")}
    </div>`}
  </div>`;

  // ═══════ EMPLOYEE TABLE (Section 04) ═══════
  if(!isEmployee()){
    h+=`<div class="card">
      <div class="sec-hdr" style="display:flex;align-items:center;gap:8px"><span style="background:#C9A84C;color:#1B3A6B;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:800">04</span> Employee Breakdown</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr style="background:linear-gradient(135deg,#1B3A6B,#2E5FA3);color:white">
          <th style="color:white">Employee</th>
          <th style="color:white">Hours</th>
          <th style="color:white">Sessions</th>
          <th style="color:white">OT</th>
          <th style="color:white">Travel</th>
          <th style="color:white">Per Diem</th>
          <th style="color:white">Leave</th>
        </tr></thead>
        <tbody>${empStats.map((e,idx)=>`<tr style="background:${idx%2?'#F5F8FC':'white'}">
          <td><strong style="color:#1B3A6B">${escapeHtml(e.emp)}</strong></td>
          <td><strong style="color:#2E5FA3">${fmtHM(e.hours)}</strong></td>
          <td style="color:var(--muted)">${e.sessions}</td>
          <td style="color:#E65100;font-weight:600">${fmtHM(e.ot)}</td>
          <td style="color:#2E7D32;font-weight:600">${e.travelDays}d</td>
          <td style="color:#6A1B9A;font-weight:600">${fmtMoney(e.perDiem)}</td>
          <td style="color:#C62828;font-weight:600">${(Number(e.leaveDays)||0).toFixed(2)}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`;
  }

  // ═══════ EXPORT BUTTONS ═══════
  h+=`<div class="card" style="background:linear-gradient(135deg,#1B3A6B 0%,#2E5FA3 100%);color:white;border:2px solid #C9A84C">
    <div class="sec-hdr" style="color:#C9A84C;border:none;display:flex;align-items:center;gap:8px"><span style="background:#C9A84C;color:#1B3A6B;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:800">📤</span> Export Options</div>
    <p style="font-size:12px;color:#B8CFE8;margin:0 0 12px">Export this filtered period in various formats — all with unified professional styling.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" style="background:#C9A84C;color:#1B3A6B;font-weight:700" onclick="exportFilteredExcel()">📊 Export Excel</button>
      <button class="btn btn-primary" style="background:#C9A84C;color:#1B3A6B;font-weight:700" onclick="exportFilteredPDF()">📄 Export PDF</button>
      <button class="btn btn-ghost" style="background:transparent;color:white;border:1px solid #C9A84C" onclick="state.reportFilter={from:'',to:''};render()">↺ Reset Filter</button>
    </div>
  </div>`;

  return h;
}

window.setReportFrom = (v)=>{state.reportFilter.from=v; render();};
window.setReportTo = (v)=>{state.reportFilter.to=v; render();};
window.applyPreset = (i)=>{
  const presets = [
    ()=>{const d=new Date();return [new Date(d.getFullYear(),d.getMonth(),1), d];},
    ()=>{const d=new Date();const e=new Date(d.getFullYear(),d.getMonth(),0);const s=new Date(e.getFullYear(),e.getMonth(),1);return [s,e];},
    ()=>{const d=new Date();return [new Date(d.getFullYear(),d.getMonth()-3,1), d];},
    ()=>{const d=new Date();return [new Date(d.getFullYear(),d.getMonth()-6,1), d];},
    ()=>{const d=new Date();return [new Date(d.getFullYear(),0,1), d];},
  ];
  const [from,to] = presets[i]();
  state.reportFilter.from = from.toISOString().split("T")[0];
  state.reportFilter.to = to.toISOString().split("T")[0];
  render();
};

function exportFilteredExcel(){
  if(typeof XLSX === 'undefined') return toast('Excel library not loaded');
  try{
    const f = state.reportFilter;
    const inRange = (r) => !r.date ? false : (!(f.from && r.date < f.from) && !(f.to && r.date > f.to));
    const leaveInRange = (l) => !l.from ? false : (!(f.from && l.from < f.from) && !(f.to && l.from > f.to));
    const allowedEmps = isEmployee() ? [state.profile.employeeName] : allEmployees();
    const dr = state.daily.filter(r=>inRange(r) && allowedEmps.includes(r.employee));
    const or = state.overtime.filter(r=>inRange(r) && allowedEmps.includes(r.employee));
    const tr = state.travel.filter(r=>inRange(r) && allowedEmps.includes(r.employee));
    const lv = state.leaves.filter(r=>leaveInRange(r) && allowedEmps.includes(r.employee));

    const wb = XLSX.utils.book_new();
    const periodStr = `${f.from || 'start'}_to_${f.to || 'end'}`;

    // ═══════ Unified Color Palette ═══════
    const COLORS = {
      navy:"1B3A6B", navyLight:"2E5FA3", gold:"C9A84C",
      green:"2E7D32", orange:"E65100", purple:"6A1B9A", red:"C62828",
      bgAlt:"F5F8FC", lineGray:"D6E4F0", white:"FFFFFF", textDark:"1A1A2E"
    };

    const titleStyle = {
      font:{bold:true,sz:18,color:{rgb:COLORS.gold},name:"Calibri"},
      fill:{fgColor:{rgb:COLORS.navy}},
      alignment:{horizontal:"center",vertical:"center"},
      border:{top:{style:"medium",color:{rgb:COLORS.gold}},bottom:{style:"medium",color:{rgb:COLORS.gold}}}
    };
    const headerStyle = {
      font:{bold:true,sz:11,color:{rgb:COLORS.white},name:"Calibri"},
      fill:{fgColor:{rgb:COLORS.navy}},
      alignment:{horizontal:"center",vertical:"center"},
      border:{top:{style:"thin",color:{rgb:COLORS.navy}},bottom:{style:"thin",color:{rgb:COLORS.gold}},left:{style:"thin",color:{rgb:COLORS.navy}},right:{style:"thin",color:{rgb:COLORS.navy}}}
    };
    const cellStyle = (alt=false) => ({
      font:{sz:10,color:{rgb:COLORS.textDark}},
      fill:{fgColor:{rgb: alt ? COLORS.bgAlt : COLORS.white}},
      alignment:{vertical:"center"},
      border:{top:{style:"thin",color:{rgb:COLORS.lineGray}},bottom:{style:"thin",color:{rgb:COLORS.lineGray}},left:{style:"thin",color:{rgb:COLORS.lineGray}},right:{style:"thin",color:{rgb:COLORS.lineGray}}}
    });
    const numStyle = (alt=false, color=COLORS.textDark) => ({
      ...cellStyle(alt),
      font:{sz:10,bold:true,color:{rgb:color}},
      alignment:{horizontal:"right",vertical:"center"}
    });
    const empNameStyle = (alt=false) => ({
      ...cellStyle(alt),
      font:{bold:true,sz:10,color:{rgb:COLORS.navy}}
    });
    const totalRowStyle = {
      font:{bold:true,sz:11,color:{rgb:COLORS.navy}},
      fill:{fgColor:{rgb:COLORS.gold}},
      alignment:{vertical:"center",horizontal:"center"},
      border:{top:{style:"medium",color:{rgb:COLORS.navy}},bottom:{style:"medium",color:{rgb:COLORS.navy}},left:{style:"thin",color:{rgb:COLORS.gold}},right:{style:"thin",color:{rgb:COLORS.gold}}}
    };

    const setCell = (ws, addr, val, style) => { ws[addr] = {v:val, t: typeof val === 'number' ? 'n' : 's'}; if(style) ws[addr].s = style; };
    const setMerge = (ws, range) => { if(!ws['!merges']) ws['!merges']=[]; ws['!merges'].push(range); };

    // ═══════ SUMMARY SHEET ═══════
    const ws1 = {};
    setCell(ws1,'A1',`Period Report — ${f.from||'start'} to ${f.to||'end'}`,titleStyle);
    setMerge(ws1,{s:{r:0,c:0},e:{r:0,c:7}});
    setCell(ws1,'A2',`Generated: ${new Date().toLocaleString('en-GB')} · By: ${state.profile.name||state.profile.email}`,{font:{italic:true,sz:10,color:{rgb:"6B7B8F"}},alignment:{horizontal:"center"}});
    setMerge(ws1,{s:{r:1,c:0},e:{r:1,c:7}});

    // KPI row
    setCell(ws1,'A4','EXECUTIVE SUMMARY',{...headerStyle,fill:{fgColor:{rgb:COLORS.navyLight}}});
    setMerge(ws1,{s:{r:3,c:0},e:{r:3,c:7}});
    setCell(ws1,'A5','Total Hours',headerStyle);
    setCell(ws1,'B5','Overtime',headerStyle);
    setCell(ws1,'C5','Travel Days',headerStyle);
    setCell(ws1,'D5','Per Diem (IQD)',headerStyle);
    setCell(ws1,'E5','Leave Days',headerStyle);
    setCell(ws1,'F5','Sessions',headerStyle);
    setCell(ws1,'G5','OT Entries',headerStyle);
    setCell(ws1,'H5','Trips',headerStyle);
    const totH = dr.reduce((s,r)=>s+Number(r.duration||0),0);
    const totOT = or.reduce((s,r)=>s+Number(r.hours||0),0);
    const totTr = tr.reduce((s,r)=>s+Number(r.days||0),0);
    const totPD = tr.reduce((s,r)=>s+Number(r.perDiem||0),0);
    const totLv = lv.reduce((s,r)=>s+Number(r.days||0),0);
    setCell(ws1,'A6',fmtHM(totH),numStyle(false,COLORS.navyLight));
    setCell(ws1,'B6',fmtHM(totOT),numStyle(false,COLORS.orange));
    setCell(ws1,'C6',totTr,numStyle(false,COLORS.green));
    setCell(ws1,'D6',totPD,numStyle(false,COLORS.purple));
    setCell(ws1,'E6',totLv,numStyle(false,COLORS.red));
    setCell(ws1,'F6',dr.length,numStyle(false));
    setCell(ws1,'G6',or.length,numStyle(false));
    setCell(ws1,'H6',tr.length,numStyle(false));

    // Department totals
    setCell(ws1,'A8','DEPARTMENT TOTALS',{...headerStyle,fill:{fgColor:{rgb:COLORS.purple}}});
    setMerge(ws1,{s:{r:7,c:0},e:{r:7,c:3}});
    setCell(ws1,'A9','Department',headerStyle);
    setCell(ws1,'B9','Hours',headerStyle);
    setCell(ws1,'C9','Entries',headerStyle);
    setCell(ws1,'D9','OT Hours',headerStyle);
    state.departments.forEach((d,idx)=>{
      const row = 10+idx;
      const alt = idx%2===1;
      const dh = dr.filter(r=>r.dept===d.name).reduce((s,r)=>s+Number(r.duration||0),0);
      const dc = dr.filter(r=>r.dept===d.name).length;
      const oh = or.filter(r=>r.dept===d.name).reduce((s,r)=>s+Number(r.hours||0),0);
      setCell(ws1,`A${row}`,d.name,{...empNameStyle(alt),font:{bold:true,sz:11,color:{rgb:d.color.replace('#','')}}});
      setCell(ws1,`B${row}`,fmtHM(dh),numStyle(alt));
      setCell(ws1,`C${row}`,dc,numStyle(alt));
      setCell(ws1,`D${row}`,fmtHM(oh),numStyle(alt,COLORS.orange));
    });

    // Employee totals
    const empRowStart = 11 + state.departments.length;
    setCell(ws1,`A${empRowStart}`,'EMPLOYEE TOTALS',{...headerStyle,fill:{fgColor:{rgb:COLORS.green}}});
    setMerge(ws1,{s:{r:empRowStart-1,c:0},e:{r:empRowStart-1,c:6}});
    const empHeadRow = empRowStart + 1;
    setCell(ws1,`A${empHeadRow}`,'Employee',headerStyle);
    setCell(ws1,`B${empHeadRow}`,'Hours',headerStyle);
    setCell(ws1,`C${empHeadRow}`,'Sessions',headerStyle);
    setCell(ws1,`D${empHeadRow}`,'OT',headerStyle);
    setCell(ws1,`E${empHeadRow}`,'Travel',headerStyle);
    setCell(ws1,`F${empHeadRow}`,'Per Diem',headerStyle);
    setCell(ws1,`G${empHeadRow}`,'Leaves',headerStyle);
    allowedEmps.forEach((e,idx)=>{
      const row = empHeadRow + 1 + idx;
      const alt = idx%2===1;
      const eh = dr.filter(r=>r.employee===e).reduce((s,r)=>s+Number(r.duration||0),0);
      const es = dr.filter(r=>r.employee===e).length;
      const eo = or.filter(r=>r.employee===e).reduce((s,r)=>s+Number(r.hours||0),0);
      const td = tr.filter(r=>r.employee===e).reduce((s,r)=>s+Number(r.days||0),0);
      const pd = tr.filter(r=>r.employee===e).reduce((s,r)=>s+Number(r.perDiem||0),0);
      const lvd = lv.filter(r=>r.employee===e).reduce((s,r)=>s+Number(r.days||0),0);
      setCell(ws1,`A${row}`,e,empNameStyle(alt));
      setCell(ws1,`B${row}`,fmtHM(eh),numStyle(alt,COLORS.navyLight));
      setCell(ws1,`C${row}`,es,numStyle(alt));
      setCell(ws1,`D${row}`,fmtHM(eo),numStyle(alt,COLORS.orange));
      setCell(ws1,`E${row}`,td,numStyle(alt,COLORS.green));
      setCell(ws1,`F${row}`,pd,numStyle(alt,COLORS.purple));
      setCell(ws1,`G${row}`,lvd,numStyle(alt,COLORS.red));
    });
    const grandRow = empHeadRow + 1 + allowedEmps.length;
    setCell(ws1,`A${grandRow}`,'GRAND TOTAL',totalRowStyle);
    setCell(ws1,`B${grandRow}`,fmtHM(totH),totalRowStyle);
    setCell(ws1,`C${grandRow}`,dr.length,totalRowStyle);
    setCell(ws1,`D${grandRow}`,fmtHM(totOT),totalRowStyle);
    setCell(ws1,`E${grandRow}`,totTr,totalRowStyle);
    setCell(ws1,`F${grandRow}`,totPD,totalRowStyle);
    setCell(ws1,`G${grandRow}`,totLv,totalRowStyle);

    ws1['!ref'] = `A1:H${grandRow}`;
    ws1['!cols'] = [{wch:24},{wch:14},{wch:12},{wch:14},{wch:12},{wch:14},{wch:12},{wch:10}];
    ws1['!rows'] = [{hpt:28},{hpt:18},{hpt:8},{hpt:22},{hpt:20},{hpt:22}];
    XLSX.utils.book_append_sheet(wb, ws1, 'Summary');

    // ═══════ DETAIL SHEETS WITH STYLE ═══════
    const buildDetail = (title, headers, data, accentColor) => {
      const ws = {};
      const accent = accentColor.replace('#','');
      setCell(ws,'A1',title.toUpperCase(),{...titleStyle, fill:{fgColor:{rgb:accent}}});
      setMerge(ws,{s:{r:0,c:0},e:{r:0,c:headers.length-1}});
      headers.forEach((h,i)=>{
        const col = String.fromCharCode(65+i);
        setCell(ws,`${col}2`,h,headerStyle);
      });
      data.forEach((row,idx)=>{
        const alt = idx%2===1;
        const rowNum = 3+idx;
        row.forEach((val,colIdx)=>{
          const col = String.fromCharCode(65+colIdx);
          if(colIdx===0) setCell(ws,`${col}${rowNum}`,val,empNameStyle(alt));
          else if(typeof val === 'number') setCell(ws,`${col}${rowNum}`,val,numStyle(alt));
          else setCell(ws,`${col}${rowNum}`,val,cellStyle(alt));
        });
      });
      ws['!ref'] = `A1:${String.fromCharCode(64+headers.length)}${2+data.length}`;
      ws['!rows'] = [{hpt:26},{hpt:20}];
      return ws;
    };

    const dailyData = dr.map(r=>[r.employee||'',r.date||'',r.project||'',r.dept||'',r.location||'',fmtHM(r.duration),r.notes||'']);
    const wsD = buildDetail('Daily Log', ['Employee','Date','Project','Department','Location','Hours','Notes'], dailyData, COLORS.navyLight);
    wsD['!cols']=[{wch:22},{wch:12},{wch:26},{wch:16},{wch:14},{wch:10},{wch:30}];
    XLSX.utils.book_append_sheet(wb, wsD, 'Daily');

    const otData = or.map(r=>[r.employee||'',r.date||'',fmtHM(r.hours),r.project||'',r.dept||'',r.location||'']);
    const wsO = buildDetail('Overtime Log', ['Employee','Date','OT Hours','Project','Department','Location'], otData, COLORS.orange);
    wsO['!cols']=[{wch:22},{wch:12},{wch:12},{wch:26},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsO, 'Overtime');

    const trData = tr.map(r=>[r.employee||'',r.date||'',r.days||0,r.project||'',r.location||'',r.perDiem||0]);
    const wsT = buildDetail('Travel Log', ['Employee','Date','Days','Project','Location','Per Diem'], trData, COLORS.green);
    wsT['!cols']=[{wch:22},{wch:12},{wch:8},{wch:26},{wch:16},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsT, 'Travel');

    const lvData = lv.map(r=>{
      const lt = (typeof leaveTypeInfo==='function') ? leaveTypeInfo(r.type) : {label:r.type||''};
      return [r.employee||'', lt.label||r.type||'', r.from||'', r.to||'', r.days||0, r.notes||''];
    });
    const wsL = buildDetail('Leaves Log', ['Employee','Type','From','To','Days','Notes'], lvData, COLORS.red);
    wsL['!cols']=[{wch:22},{wch:18},{wch:12},{wch:12},{wch:8},{wch:30}];
    XLSX.utils.book_append_sheet(wb, wsL, 'Leaves');

    XLSX.writeFile(wb, `Period_Report_${periodStr}.xlsx`);
    toast('Filtered Excel exported ✓');
  }catch(e){
    console.error(e);
    toast('Export failed: '+e.message);
  }
}
window.exportFilteredExcel = exportFilteredExcel;

// ═══════════════════════════════════════════════════════════════════════
//  EXPORT FILTERED PDF — Unified Style for the Reports Tab
// ═══════════════════════════════════════════════════════════════════════
function exportFilteredPDF(){
  try{
    const f = state.reportFilter;
    const inRange = (r) => !r.date ? false : (!(f.from && r.date < f.from) && !(f.to && r.date > f.to));
    const leaveInRange = (l) => !l.from ? false : (!(f.from && l.from < f.from) && !(f.to && l.from > f.to));
    const allowedEmps = isEmployee() ? [state.profile.employeeName] : allEmployees();
    const dr = state.daily.filter(r=>inRange(r) && allowedEmps.includes(r.employee));
    const or = state.overtime.filter(r=>inRange(r) && allowedEmps.includes(r.employee));
    const tr = state.travel.filter(r=>inRange(r) && allowedEmps.includes(r.employee));
    const lv = state.leaves.filter(r=>leaveInRange(r) && allowedEmps.includes(r.employee));

    const totH = dr.reduce((s,r)=>s+Number(r.duration||0),0);
    const totOT = or.reduce((s,r)=>s+Number(r.hours||0),0);
    const totTr = tr.reduce((s,r)=>s+Number(r.days||0),0);
    const totPD = tr.reduce((s,r)=>s+Number(r.perDiem||0),0);
    const totLv = lv.reduce((s,r)=>s+Number(r.days||0),0);
    const todayStr = new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});

    // Department breakdown
    const deptStats = state.departments.map(d=>{
      const dh = dr.filter(r=>r.dept===d.name).reduce((s,r)=>s+Number(r.duration||0),0);
      const dc = dr.filter(r=>r.dept===d.name).length;
      const oh = or.filter(r=>r.dept===d.name).reduce((s,r)=>s+Number(r.hours||0),0);
      return {...d, hours:dh, count:dc, otHours:oh};
    });

    // Employee summary
    const empStats = allowedEmps.map(emp=>{
      const eDaily = dr.filter(r=>r.employee===emp);
      const eOT = or.filter(r=>r.employee===emp);
      const eTr = tr.filter(r=>r.employee===emp);
      const eLv = lv.filter(r=>r.employee===emp);
      return {
        emp,
        hours: eDaily.reduce((s,r)=>s+Number(r.duration||0),0),
        sessions: eDaily.length,
        ot: eOT.reduce((s,r)=>s+Number(r.hours||0),0),
        travelDays: eTr.reduce((s,r)=>s+Number(r.days||0),0),
        perDiem: eTr.reduce((s,r)=>s+Number(r.perDiem||0),0),
        leaveDays: eLv.reduce((sum, r) => {
        if(r.days !== undefined && r.days !== null && !isNaN(Number(r.days))) return sum + Number(r.days);
        if(r.hours !== undefined && r.hours !== null && !isNaN(Number(r.hours))) return sum + (Number(r.hours) / WORK_HOURS_PER_DAY);
        return sum + computeLeaveAmount(r).days;
      }, 0),
        byDept: state.departments.reduce((acc,d)=>{acc[d.name]=eDaily.filter(r=>r.dept===d.name).reduce((s,r)=>s+Number(r.duration||0),0);return acc;},{}),
      };
    });

    const css=`
      @page { size: A4; margin: 12mm; }
      *{box-sizing:border-box;font-family:-apple-system,'Segoe UI',Inter,Arial,sans-serif;}
      body{margin:0;color:#1A1A2E;font-size:11px;line-height:1.4;background:#fff}
      .head{background:linear-gradient(135deg,#1B3A6B 0%,#2E5FA3 100%);color:white;padding:20px 22px;border-radius:10px;margin-bottom:16px;border:2px solid #C9A84C;position:relative;overflow:hidden;page-break-inside:avoid}
      .head::before{content:'';position:absolute;top:0;right:0;width:140px;height:140px;background:radial-gradient(circle,rgba(201,168,76,0.15),transparent);border-radius:50%}
      .head-row{display:flex;align-items:center;gap:14px;position:relative}
      .head-logo{width:54px;height:54px;border:2px solid #C9A84C;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#1B3A6B}
      .head-logo span{font-family:Georgia,serif;font-size:16px;color:#C9A84C;font-weight:700}
      .head-title{font-family:Georgia,serif;font-size:22px;color:#fff;margin:0;line-height:1.2}
      .head-tag{font-size:10px;color:#C9A84C;text-transform:uppercase;letter-spacing:1.5px;margin-top:3px}
      .head-meta{font-size:11px;color:#B8CFE8;margin-top:6px}
      .head-meta strong{color:#fff}
      .head-by{font-size:10px;color:#8AA8C8;font-style:italic;margin-top:2px}
      .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;page-break-inside:avoid}
      .kpi{border:1px solid #D6E4F0;border-radius:8px;padding:10px;background:#fff;border-left-width:4px;border-left-style:solid}
      .kpi-label{font-size:9px;color:#6B7B8F;text-transform:uppercase;font-weight:700;letter-spacing:0.6px}
      .kpi-val{font-family:Georgia,serif;font-size:20px;margin-top:2px;font-weight:700}
      .kpi-sub{font-size:9px;color:#6B7B8F;margin-top:2px}
      .sec-h{font-size:14px;background:linear-gradient(90deg,#1B3A6B,#2E5FA3);color:white;padding:9px 14px;border-radius:6px;margin:18px 0 10px;display:flex;align-items:center;gap:10px;page-break-after:avoid}
      .sec-num{background:#C9A84C;color:#1B3A6B;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:800}
      table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:10px;border-radius:6px;overflow:hidden}
      th{background:linear-gradient(135deg,#1B3A6B,#2E5FA3);color:white;padding:8px;text-align:left;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.4px}
      td{padding:6px 8px;border-bottom:1px solid #E1E8F0}
      tr:nth-child(even) td{background:#F5F8FC}
      tr.grand td{background:linear-gradient(135deg,#C9A84C,#B58E2E)!important;color:#1B3A6B;font-weight:800;font-size:11px}
      .dept-card{border:1px solid #D6E4F0;border-radius:8px;padding:10px 12px;margin-bottom:8px;border-left:4px solid;page-break-inside:avoid}
      .dept-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
      .dept-name{font-weight:700;font-size:12px}
      .dept-val{font-family:Georgia,serif;font-size:16px;font-weight:700}
      .dept-sub{font-size:10px;color:#6B7B8F;margin-bottom:5px}
      .bar{height:5px;background:#F0F0F0;border-radius:3px;overflow:hidden}
      .bar-fill{height:100%}
      .footer{margin-top:20px;padding:12px;background:#F5F8FC;border:1px dashed #D6E4F0;border-radius:6px;text-align:center;font-size:10px;color:#6B7B8F}
      .footer strong{color:#1B3A6B}
      .empty{padding:14px;text-align:center;color:#888;font-style:italic;font-size:10px}
      @media print { .no-print { display:none } body{background:#fff} }
      .actions{padding:12px;background:#FFF8E1;border:1px solid #FFE082;border-radius:8px;margin-bottom:14px;text-align:center;font-size:13px;color:#7F6000}
      .actions button{background:#1B3A6B;color:#C9A84C;border:none;padding:10px 24px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;margin:0 4px}
    `;

    const kpiCards = `<div class="kpi-grid">
      <div class="kpi" style="border-left-color:#2E5FA3"><div class="kpi-label">Total Hours</div><div class="kpi-val" style="color:#2E5FA3">${fmtHM(totH)}</div><div class="kpi-sub">${dr.length} sessions</div></div>
      <div class="kpi" style="border-left-color:#E65100"><div class="kpi-label">Overtime</div><div class="kpi-val" style="color:#E65100">${fmtHM(totOT)}</div><div class="kpi-sub">${or.length} entries</div></div>
      <div class="kpi" style="border-left-color:#2E7D32"><div class="kpi-label">Travel Days</div><div class="kpi-val" style="color:#2E7D32">${totTr}</div><div class="kpi-sub">${tr.length} trips</div></div>
      <div class="kpi" style="border-left-color:#6A1B9A"><div class="kpi-label">Per Diem</div><div class="kpi-val" style="color:#6A1B9A">${fmtMoney(totPD)}</div><div class="kpi-sub">IQD total</div></div>
      <div class="kpi" style="border-left-color:#C62828"><div class="kpi-label">Leave Days</div><div class="kpi-val" style="color:#C62828">${totLv}</div><div class="kpi-sub">${lv.length} entries</div></div>
    </div>`;

    // Department cards
    const deptBlocks = deptStats.map(d=>{
      const totalDept = deptStats.reduce((s,x)=>s+x.hours,0);
      const pct = totalDept>0 ? (d.hours/totalDept*100).toFixed(1) : '0.0';
      return `<div class="dept-card" style="border-left-color:${d.color}">
        <div class="dept-row"><span class="dept-name" style="color:${d.color}">${escapeHtml(d.name)}</span><span class="dept-val" style="color:${d.color}">${fmtHM(d.hours)}</span></div>
        <div class="dept-sub">${d.count} entries · ${fmtHM(d.otHours)} OT · ${pct}% of total</div>
        <div class="bar"><div class="bar-fill" style="background:${d.color};width:${pct}%"></div></div>
      </div>`;
    }).join('');

    // Employee summary table
    const deptHeaders = state.departments.map(d=>`<th style="border-bottom:3px solid ${d.color}">${escapeHtml(d.name.slice(0,10))}</th>`).join('');
    const empRows = empStats.map(r=>`<tr>
      <td><strong style="color:#1B3A6B">${escapeHtml(r.emp)}</strong></td>
      ${state.departments.map(d=>`<td style="color:${d.color};font-weight:700">${fmtHM(r.byDept[d.name]||0)}</td>`).join('')}
      <td><strong style="color:#1B3A6B">${fmtHM(r.hours)}</strong></td>
      <td style="color:#E65100;font-weight:600">${fmtHM(r.ot)}</td>
      <td style="color:#2E7D32;font-weight:600">${r.travelDays}</td>
      <td style="color:#6A1B9A;font-weight:600">${fmtMoney(r.perDiem)}</td>
      <td style="color:#C62828;font-weight:600">${r.leaveDays}</td>
    </tr>`).join("");
    const grandRow = !isEmployee()?`<tr class="grand">
      <td>GRAND TOTAL</td>
      ${state.departments.map(d=>`<td>${fmtHM(empStats.reduce((s,e)=>s+(e.byDept[d.name]||0),0))}</td>`).join('')}
      <td>${fmtHM(totH)}</td><td>${fmtHM(totOT)}</td><td>${totTr}</td><td>${fmtMoney(totPD)}</td><td>${totLv}</td>

    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Period Report — ${f.from} to ${f.to}</title><style>${css}</style></head><body>
      <div class="actions no-print">
        📄 Click <strong>"Save as PDF"</strong> when the print dialog appears
        <br><br>
        <button onclick="window.print()">🖨️ Save as PDF / Print</button>
        <button onclick="window.close()" style="background:#888">Close</button>

      <div class="head">
        <div class="head-row">

          <div style="flex:1">
            <div class="head-title">Period Report</div>
            <div class="head-tag">Operation Department Track</div>
            <div class="head-meta">Range: <strong>${escapeHtml(f.from||'start')}</strong> → <strong>${escapeHtml(f.to||'today')}</strong> · Issued: ${todayStr}</div>
            <div class="head-by">By: ${escapeHtml(state.profile.name||state.profile.email)}</div>
          </div>
        </div>
      </div>

      <h2 class="sec-h"><span class="sec-num">01</span> Executive Summary</h2>
      ${kpiCards}

      <h2 class="sec-h"><span class="sec-num">02</span> Department Performance</h2>
      ${deptBlocks || '<div class="empty">No departments configured</div>'}

      ${!isEmployee()?`<h2 class="sec-h"><span class="sec-num">03</span> Employee Breakdown</h2>
      <table><thead><tr><th>Employee</th>${deptHeaders}<th>Total</th><th>OT</th><th>Travel</th><th>Per Diem</th><th>Leave</th></tr></thead>
        <tbody>${empRows}${grandRow}</tbody></table>`:''}

      <div class="footer">
        <strong>EjafTech Operations</strong> · Period Report · Generated by Operation Department Track

    </body></html>`;

    const w = window.open('','_blank');
    if(!w){toast('Allow pop-ups to export PDF');return;}
    w.document.write(html);
    w.document.close();
    toast('PDF print dialog opening...');
  }catch(e){
    console.error(e);
    toast('PDF export failed: '+e.message);
  }
}
